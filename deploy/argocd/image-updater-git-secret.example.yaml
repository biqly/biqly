# One-time cluster secret for git write-back (do not commit real credentials).
# kubectl create secret generic argocd-image-updater-git -n argocd \
#   --from-literal=username=<github-user> \
#   --from-literal=password=<github-pat-with-repo-write>
apiVersion: v1
kind: Secret
metadata:
  name: argocd-image-updater-git
  namespace: argocd
type: Opaque
stringData:
  username: REPLACE_ME
  password: REPLACE_ME
