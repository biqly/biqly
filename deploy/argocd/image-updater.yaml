apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: biqly
  namespace: argocd
spec:
  writeBackConfig:
    method: git:secret:argocd/argocd-image-updater-git
    gitConfig:
      branch: main
  commonUpdateSettings:
    updateStrategy: newest-build
    allowTags: regexp:^sha-[0-9a-f]{40}$
    ignoreTags:
      - latest
    forceUpdate: true
  applicationRefs:
    - namePattern: biqly
      images:
        - alias: ai
          imageName: ghcr.io/biqly/ai
          manifestTargets:
            helm:
              name: ai.image.repository
              tag: ai.image.tag
        - alias: query
          imageName: ghcr.io/biqly/query
          manifestTargets:
            helm:
              name: query.image.repository
              tag: query.image.tag
        - alias: catalog
          imageName: ghcr.io/biqly/catalog
          manifestTargets:
            helm:
              name: catalog.image.repository
              tag: catalog.image.tag
        - alias: frontend
          imageName: ghcr.io/biqly/biqly-frontend
          manifestTargets:
            helm:
              name: frontend.image.repository
              tag: frontend.image.tag
        - alias: auth
          imageName: ghcr.io/biqly/biqly-auth
          manifestTargets:
            helm:
              name: auth.image.repository
              tag: auth.image.tag
        - alias: auth-migrate
          imageName: ghcr.io/biqly/biqly-auth
          manifestTargets:
            helm:
              name: auth.migrate.image.repository
              tag: auth.migrate.image.tag
        - alias: mail
          imageName: ghcr.io/biqly/biqly-mail
          manifestTargets:
            helm:
              name: mail.image.repository
              tag: mail.image.tag
        - alias: mail-migrate
          imageName: ghcr.io/biqly/biqly-mail
          manifestTargets:
            helm:
              name: mail.migrate.image.repository
              tag: mail.migrate.image.tag
        # NOTE: ghcr.io/biqly/migrate is intentionally NOT tracked here. The
        # PreSync migrate Job is deleted on success (hook-delete-policy), so
        # its image never appears in the Application's live image list and the
        # updater would permanently skip it. Instead the Helm template pins
        # the migrate tag to the catalog image tag (same commit sha) — see
        # deploy/helm/biqly/templates/migrate-job.yaml.
