global:
  imagePullSecrets:
    - name: ghcr-registry
  postgresqlVIP:
    enabled: true
  gateway:
    hostnames:
      - abi.il1.nl
  secrets:
    createSecrets: false
  config:
    BI_LOG_LEVEL: info
    BI_LOG_FORMAT: json
    BI_QUERY_TIMEOUT_SECONDS: "30"
    BI_QUERY_MAX_ROWS: "10000"
    BI_QUERY_MAX_RUNTIME_SECONDS: "60"
    BI_REDIS_DSN: redis://biqly-dragonfly:6379
    BI_AUTH_ENABLED: "true"
    # Every JWT-enforcing service needs the auth service URL to fetch the JWT
    # public key — without it BI_AUTH_ENABLED=true makes /api answer 503.
    BI_AUTH_SERVICE_URL: http://biqly-auth:8889
    # PII detection & role-based masking (see docs/pii-detection-masking.md)
    BI_PII_ENABLED: "true"
    BI_PII_DETECTION_THRESHOLD: "0.6"
    BI_PII_SAMPLE_DATA_LIMIT: "50"
    BI_PII_AUTO_SCAN_ON_SYNC: "true"
    BI_PII_DEFAULT_MASKING_STRATEGY: partial
  observability:
    serviceMonitor:
      enabled: false
    prometheusRules:
      enabled: false
    alertmanager:
      enabled: false
    logs:
      vectorConfig:
        enabled: false
    tracing:
      enabled: true
      serviceName: biqly
      # Collector upstream. Direct to kibrit's OTLP receiver over Tailscale
      # (token-gated, encrypted by Tailscale) instead of the Cloudflare path
      # (https://otel.il1.nl), removing the public round-trip. Apps still export
      # to the in-cluster collector; only the collector forwards here.
      otlpEndpoint: http://100.84.49.60:4318
      # Parent-based ratio keeps trace volume (and the export load it adds to the
      # single-node cluster) bounded while still capturing connected cross-service
      # traces. Raise temporarily to always_on only for focused investigation.
      sampler: always_on
      samplerArg: "0.1"
      otlpHeadersSecret:
        name: biqly-otel-secrets
        key: OTEL_EXPORTER_OTLP_HEADERS
      otelCollector:
        enabled: false
      jaeger:
        enabled: false
    dashboards:
      enabled: true
  networkPolicy:
    aiExternal:
      allowWorldHTTPS: true
      cidrs:
        - 100.118.9.4/32
  migrate:
    enabled: true
    backoffLimit: 3

auth:
  enabled: true
  replicaCount: 1
  image:
    repository: auth
    tag: sha-38de6ea19634422920df5b7f49e8fad6b49ed3bf
  migrate:
    image:
      repository: auth
      tag: sha-38de6ea19634422920df5b7f49e8fad6b49ed3bf
  autoscaling:
    minReplicas: 1
    maxReplicas: 2

# mail image is now published by CI (ghcr.io/biqly/mail). Prod
# requires the bi_mail database and the BI_MAIL_DB_DSN / BI_MAIL_INTERNAL_TOKEN
# secret values to be provisioned, and (optionally) the ArgoCD image-updater
# list extended to track mail for sha-pinned tags instead of latest.
mail:
  enabled: true
  replicaCount: 1
  smtp:
    enabled: true
  config:
    BI_MAIL_SMTP_HOST: smtp.mail.me.com
    BI_MAIL_SMTP_PORT: "587"
    BI_MAIL_SMTP_FROM: no-reply@il1.nl
    BI_MAIL_SMTP_SENDER_NAME: "ABI"
  image:
    repository: mail
    tag: latest
  migrate:
    image:
      repository: mail
      tag: latest

frontend:
  replicaCount: 1
  image:
    tag: sha-56b921c7800edf2ee5c29a91dfad5f764bdd9d87
  runtimeAdminKey:
    enabled: true

catalog:
  replicaCount: 1
  image:
    tag: sha-91a9ff58d06ca78fdf3cf136c42c65c1e8b349a6
  autoscaling:
    minReplicas: 1
    maxReplicas: 2

query:
  replicaCount: 1
  image:
    tag: sha-91a9ff58d06ca78fdf3cf136c42c65c1e8b349a6
  autoscaling:
    minReplicas: 1
    maxReplicas: 2

ai:
  replicaCount: 1
  image:
    tag: sha-91a9ff58d06ca78fdf3cf136c42c65c1e8b349a6
  rollout:
    enabled: false
  autoscaling:
    minReplicas: 1
    maxReplicas: 2
  config:
    # Provider/model selection (provider type, model ids, base URLs, API keys and
    # per-model tuning) is managed in the database via Administration → AI
    # Providers — NOT here. Only operational knobs below are environment-driven.
    BI_AI_TRANSLATION_TARGET_LANGUAGE: Turkish
    BI_AI_TRANSLATION_TARGET_CODE: tr
    BI_AI_TRANSLATION_HTTP_TIMEOUT_SECONDS: "120"
    BI_AI_RATE_LIMIT_PER_MINUTE: "20"
    BI_AI_MAX_PROMPT_RUNES: "40000"
    BI_AI_MAX_RETRIES: "1"
    BI_AI_DESCRIBE_MAX_CELL_RUNES: "500"
    BI_AI_DESCRIBE_MAX_SAMPLE_ROWS: "12"
    BI_AI_HTTP_TIMEOUT_SECONDS: "1200"
    BI_AI_EMBEDDING_HTTP_TIMEOUT_SECONDS: "1200"
    BI_AI_ROUTE_MAX_DIMENSIONS: "56"
    BI_AI_ROUTE_MAX_METRICS: "32"
    BI_AI_ROUTE_MAX_COLUMNS_PER_TABLE: "14"
    BI_AI_ROUTE_MAX_DATE_GRAIN_EXTRAS: "20"
    BI_AI_ROUTE_SLIM_NUMERIC_METRICS: "true"
    BI_AI_JOBS_ENABLED: "true"
    BI_NATS_URL: nats://biqly-nats:4222
