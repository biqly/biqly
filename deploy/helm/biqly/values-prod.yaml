global:
  imagePullSecrets:
    - name: ghcr-registry
  gateway:
    hostnames:
      - abi.il1.nl
  secrets:
    createSecrets: false
  config:
    BI_LOG_LEVEL: info
    BI_LOG_FORMAT: json
    BI_QUERY_TIMEOUT_SECONDS: "30"
    BI_QUERY_MAX_ROWS: "10000"
    BI_QUERY_MAX_RUNTIME_SECONDS: "60"
    BI_REDIS_DSN: redis://biqly-dragonfly:6379
  observability:
    serviceMonitor:
      enabled: false
    prometheusRules:
      enabled: false
    alertmanager:
      enabled: false
    logs:
      vectorConfig:
        enabled: false
    tracing:
      otelCollector:
        enabled: false
      jaeger:
        enabled: false
    dashboards:
      enabled: true
  networkPolicy:
    aiExternal:
      cidrs:
        - 100.118.9.4/32
  migrate:
    image:
      tag: sha-5bbf7450e0d42ab2b8be43a77ce1b43d69577b62

frontend:
  replicaCount: 1
  image:
    tag: sha-5bbf7450e0d42ab2b8be43a77ce1b43d69577b62
  runtimeAdminKey:
    enabled: true

catalog:
  replicaCount: 1
  autoscaling:
    minReplicas: 1
    maxReplicas: 2

query:
  replicaCount: 1
  autoscaling:
    minReplicas: 1
    maxReplicas: 2

