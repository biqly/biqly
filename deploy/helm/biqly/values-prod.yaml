global:
  # prag is a single 4-core node; rollouts must not schedule a second pod (default
  # maxSurge 25% ≈ +1 replica) while the old one is still running.
  # Resource requests tuned from kubectl top + kube-prometheus-stack (2026-06-10);
  # leave ~2–3× headroom over observed peaks for burst (query rows, AI prompts).
  dragonfly:
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        cpu: 500m
        # Dragonfly v1.38+ needs ~256Mi per IO thread *plus* maxmemory (~80% of cgroup).
        # 256Mi limit crashes: "There are 1 threads, so 256.00MiB are required. Exiting..."
        memory: 512Mi
  nats:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 128Mi
  deploymentStrategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  imagePullSecrets:
    - name: ghcr-registry
  # Selects app.kubernetes.io/name: postgresql pods (the embedded Bitnami
  # subchart, disabled below in favor of the shared prag-postgresql
  # instance) -- keep disabled to match the base default, otherwise this
  # LoadBalancer allocates an external IP with no matching endpoints.
  postgresqlVIP:
    enabled: false
  gateway:
    parentRef:
      name: eg-gw
      namespace: envoy-gateway-system
    hostnames:
      - abi.il1.nl
  secrets:
    createSecrets: false
  config:
    BI_LOG_LEVEL: info
    BI_LOG_FORMAT: json
    BI_QUERY_TIMEOUT_SECONDS: "30"
    BI_QUERY_MAX_ROWS: "10000"
    BI_QUERY_MAX_RUNTIME_SECONDS: "60"
    BI_REDIS_DSN: redis://biqly-dragonfly:6379
    BI_AUTH_ENABLED: "true"
    # Every JWT-enforcing service needs the auth service URL to fetch the JWT
    # public key — without it BI_AUTH_ENABLED=true makes /api answer 503.
    BI_AUTH_SERVICE_URL: http://biqly-auth:8889
    BI_CORS_ALLOWED_ORIGINS: https://abi.il1.nl
    # PII detection & role-based masking (see docs/pii-detection-masking.md)
    BI_PII_ENABLED: "true"
    BI_PII_DETECTION_THRESHOLD: "0.6"
    BI_PII_SAMPLE_DATA_LIMIT: "50"
    BI_PII_AUTO_SCAN_ON_SYNC: "true"
    BI_PII_DEFAULT_MASKING_STRATEGY: partial
  observability:
    serviceMonitor:
      enabled: false
    prometheusRules:
      enabled: false
    alertmanager:
      enabled: false
    logs:
      vectorConfig:
        enabled: false
    infraTelemetry:
      enabled: false
    tracing:
      enabled: false
    dashboards:
      enabled: false
  networkPolicy:
    otelCollectorUpstream:
      enabled: false
    sharedPostgresql:
      enabled: true
      namespace: postgresql
      instanceName: prag-postgresql
    aiExternal:
      allowWorldHTTPS: true
      cidrs:
        - 100.118.9.4/32
  migrate:
    enabled: true
    backoffLimit: 3
auth:
  enabled: true
  config:
    BI_AUTH_CORS_ALLOWED_ORIGINS: https://abi.il1.nl
  replicaCount: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 128Mi
  image:
    repository: auth
    tag: sha-df9137d7d7f738ce642fc780a9d5441e581c1034
  migrate:
    image:
      repository: auth
      tag: sha-df9137d7d7f738ce642fc780a9d5441e581c1034
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
# mail image is now published by CI (ghcr.io/biqly/mail). Prod
# requires the bi_mail database and the BI_MAIL_DB_DSN / BI_MAIL_INTERNAL_TOKEN
# secret values to be provisioned, and (optionally) the ArgoCD image-updater
# list extended to track mail for sha-pinned tags instead of latest.
mail:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 128Mi
  smtp:
    enabled: true
  config:
    BI_MAIL_SMTP_HOST: smtp.mail.me.com
    BI_MAIL_SMTP_PORT: "587"
    BI_MAIL_SMTP_FROM: no-reply@il1.nl
    BI_MAIL_SMTP_SENDER_NAME: "ABI"
  image:
    repository: mail
    tag: sha-df9137d7d7f738ce642fc780a9d5441e581c1034
  migrate:
    image:
      repository: mail
      tag: sha-df9137d7d7f738ce642fc780a9d5441e581c1034
frontend:
  replicaCount: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 64Mi
  image:
    tag: sha-1e8839936c0289ae5eb3b89f7b41adbcc097b3d8
catalog:
  replicaCount: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  image:
    tag: sha-df9137d7d7f738ce642fc780a9d5441e581c1034
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
query:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  image:
    tag: sha-df9137d7d7f738ce642fc780a9d5441e581c1034
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
worker:
  replicaCount: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
  image:
    tag: sha-df9137d7d7f738ce642fc780a9d5441e581c1034
# Re-deployed 2026-07-07: ConnectNATS fixed to merge subjects instead of
# replacing them (b98ace38). Agent runs in shadow mode observing/comparing
# results alongside the legacy pipeline, with its own job subject
# (biqly.agent.jobs) on the shared BIQLY_AI_JOBS stream.
agent:
  enabled: true
  replicaCount: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
  image:
    tag: sha-df9137d7d7f738ce642fc780a9d5441e581c1034
mcp:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 300m
      memory: 192Mi
  image:
    tag: sha-df9137d7d7f738ce642fc780a9d5441e581c1034
  config:
    # MCP proxies tool calls to the API gateway; the hostname must match the
    # gateway HTTPRoutes (see global.gateway.hostnames).
    BI_API_SERVICE_URL: https://abi.il1.nl
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
ai:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 1000m
      # 512Mi OOMKilled the pod (exit 137) as soon as a web agent run started:
      # the old sizing assumed this pod only serves light HTTP (the heavy
      # pipeline ran on workers via NATS), but the web agent runs the full
      # pipeline in-request AND its run_question tool loops back into this
      # same pod — one question = planner + a complete legacy pipeline
      # execution concurrently. 1Gi matches the base chart's default.
      memory: 1Gi
  image:
    tag: sha-df9137d7d7f738ce642fc780a9d5441e581c1034
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
  config:
    # Provider/model selection (provider type, model ids, base URLs, API keys and
    # per-model tuning) is managed in the database via Administration → AI
    # Providers — NOT here. Only operational knobs below are environment-driven.
    BI_AI_TRANSLATION_TARGET_LANGUAGE: Turkish
    BI_AI_TRANSLATION_TARGET_CODE: tr
    BI_AI_TRANSLATION_HTTP_TIMEOUT_SECONDS: "120"
    BI_AI_RATE_LIMIT_PER_MINUTE: "20"
    BI_AI_MAX_PROMPT_RUNES: "40000"
    BI_AI_MAX_RETRIES: "1"
    BI_AI_DESCRIBE_MAX_CELL_RUNES: "500"
    BI_AI_DESCRIBE_MAX_SAMPLE_ROWS: "12"
    BI_AI_HTTP_TIMEOUT_SECONDS: "1200"
    BI_AI_EMBEDDING_HTTP_TIMEOUT_SECONDS: "1200"
    BI_AI_ROUTE_MAX_DIMENSIONS: "56"
    BI_AI_ROUTE_MAX_METRICS: "32"
    BI_AI_ROUTE_MAX_COLUMNS_PER_TABLE: "14"
    BI_AI_ROUTE_MAX_DATE_GRAIN_EXTRAS: "20"
    BI_AI_ROUTE_SLIM_NUMERIC_METRICS: "true"
    BI_AI_JOBS_ENABLED: "true"
    BI_NATS_URL: nats://biqly-nats:4222
    BI_WEB_AGENT_ENABLED: "true"
    # Web agent tools loop back through the API gateway, same pattern and same
    # hostname as MCP's BI_API_SERVICE_URL below — must match the gateway
    # HTTPRoutes (see global.gateway.hostnames). Without this, webAgentDispatcher
    # is never wired and /api/agent/chat fails with "web agent runtime is not
    # configured" (BI_WEB_AGENT_ENABLED=true alone is not sufficient).
    BI_API_SERVICE_URL: https://abi.il1.nl
    # Soft heap ceiling ~90% of the 1Gi cgroup limit: Go's GC collects
    # aggressively as the heap approaches this instead of letting the kernel
    # OOM-kill the pod mid-SSE-stream (the failure mode that motivated the
    # limit raise above).
    GOMEMLIMIT: 900MiB
  ambiguity:
    tieredEnabled: true
    maxLLMTierPerQuestion: 1
postgresql:
  # Migrated to the shared prag-postgresql instance (see
  # docs/superpowers/specs/2026-06-28-prag-shared-postgresql-design.md).
  # Disable the embedded subchart so the old biqly-postgresql StatefulSet is
  # no longer rendered/managed by this release.
  enabled: false
  primary:
    resources:
      requests:
        cpu: 50m
        memory: 192Mi
      limits:
        cpu: 500m
        memory: 384Mi
