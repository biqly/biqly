global:
  # prag is a single 4-core node; rollouts must not schedule a second pod (default
  # maxSurge 25% ≈ +1 replica) while the old one is still running.
  # Resource requests tuned from kubectl top + kube-prometheus-stack (2026-06-10);
  # leave ~2–3× headroom over observed peaks for burst (query rows, AI prompts).
  dragonfly:
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        cpu: 500m
        # Dragonfly v1.38+ needs ~256Mi per IO thread *plus* maxmemory (~80% of cgroup).
        # 256Mi limit crashes: "There are 1 threads, so 256.00MiB are required. Exiting..."
        memory: 512Mi
  nats:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 128Mi
  deploymentStrategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  imagePullSecrets:
    - name: ghcr-registry
  # Selects app.kubernetes.io/name: postgresql pods (the embedded Bitnami
  # subchart, disabled below in favor of the shared prag-postgresql
  # instance) -- keep disabled to match the base default, otherwise this
  # LoadBalancer allocates an external IP with no matching endpoints.
  postgresqlVIP:
    enabled: false
  gateway:
    parentRef:
      name: eg-gw
      namespace: envoy-gateway-system
    hostnames:
      - abi.il1.nl
  secrets:
    createSecrets: false
  config:
    BI_LOG_LEVEL: info
    BI_LOG_FORMAT: json
    BI_QUERY_TIMEOUT_SECONDS: "30"
    BI_QUERY_MAX_ROWS: "10000"
    BI_QUERY_MAX_RUNTIME_SECONDS: "60"
    BI_REDIS_DSN: redis://biqly-dragonfly:6379
    BI_AUTH_ENABLED: "true"
    # Every JWT-enforcing service needs the auth service URL to fetch the JWT
    # public key — without it BI_AUTH_ENABLED=true makes /api answer 503.
    BI_AUTH_SERVICE_URL: http://biqly-auth:8889
    # PII detection & role-based masking (see docs/pii-detection-masking.md)
    BI_PII_ENABLED: "true"
    BI_PII_DETECTION_THRESHOLD: "0.6"
    BI_PII_SAMPLE_DATA_LIMIT: "50"
    BI_PII_AUTO_SCAN_ON_SYNC: "true"
    BI_PII_DEFAULT_MASKING_STRATEGY: partial
  observability:
    # Disabled until a Prometheus/operator stack is deployed in the cluster.
    # Without one, ServiceMonitors target a non-existent `monitoring` namespace
    # and both ServiceMonitors and PrometheusRules have no consumer.
    serviceMonitor:
      enabled: false
    prometheusRules:
      enabled: false
    alertmanager:
      enabled: false
    logs:
      vectorConfig:
        enabled: false
    infraTelemetry:
      resources:
        requests:
          cpu: 50m
          memory: 160Mi
        limits:
          cpu: 500m
          memory: 256Mi
      # Now on the shared prag-postgresql instance (see
      # docs/superpowers/specs/2026-06-28-prag-shared-postgresql-design.md);
      # that CNPG instance exposes its own Prometheus metrics
      # (prag-postgresql-metrics:9187), so this per-app scraper -- which also
      # pointed at the deleted biqly-postgresql host/secret -- is redundant.
      # Disabled rather than repointed to avoid handing app-level credentials
      # to a shared instance's monitoring surface.
      postgresql:
        enabled: false
    tracing:
      enabled: true
      serviceName: biqly
      # Collector upstream: SigNoz OTLP ingest on kibrit, direct over Tailscale
      # (encrypted by Tailscale, no public exposure). Apps still export to the
      # in-cluster collector; only the collector forwards here.
      otlpEndpoint: http://100.84.49.60:4318
      # In-cluster collector connectivity from app pods has been unreliable
      # (e.g. biqly-worker stuck at wait-for-otel-collector init step even
      # though the collector itself is healthy). Skip the pre-flight wait so
      # app startup is never blocked by it; the OTel SDK retries exports on
      # its own once the collector is reachable.
      skipCollectorWait: true
      # Export every span while Jaeger / OTLP path is being validated. Revert to
      # parentbased_traceidratio (e.g. 0.1) once volume is acceptable on the cluster.
      sampler: parentbased_traceidratio
      samplerArg: "0.1"
      otlpHeadersSecret:
        name: biqly-otel-secrets
        key: OTEL_EXPORTER_OTLP_HEADERS
    dashboards:
      enabled: true
  networkPolicy:
    otelCollectorUpstream:
      enabled: true
      cidrs:
        - 100.84.49.60/32
      ports:
        - 4318
    sharedPostgresql:
      enabled: true
      namespace: postgresql
      instanceName: prag-postgresql
    aiExternal:
      allowWorldHTTPS: true
      cidrs:
        - 100.118.9.4/32
  migrate:
    enabled: true
    backoffLimit: 3
auth:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 128Mi
  image:
    repository: auth
    tag: sha-fc93b3bf3c15ebe5244e430e17102b9fd24f3471
  migrate:
    image:
      repository: auth
      tag: sha-fc93b3bf3c15ebe5244e430e17102b9fd24f3471
  autoscaling:
    minReplicas: 1
    maxReplicas: 2
# mail image is now published by CI (ghcr.io/biqly/mail). Prod
# requires the bi_mail database and the BI_MAIL_DB_DSN / BI_MAIL_INTERNAL_TOKEN
# secret values to be provisioned, and (optionally) the ArgoCD image-updater
# list extended to track mail for sha-pinned tags instead of latest.
mail:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 128Mi
  smtp:
    enabled: true
  config:
    BI_MAIL_SMTP_HOST: smtp.mail.me.com
    BI_MAIL_SMTP_PORT: "587"
    BI_MAIL_SMTP_FROM: no-reply@il1.nl
    BI_MAIL_SMTP_SENDER_NAME: "ABI"
  image:
    repository: mail
    tag: sha-fc93b3bf3c15ebe5244e430e17102b9fd24f3471
  migrate:
    image:
      repository: mail
      tag: sha-fc93b3bf3c15ebe5244e430e17102b9fd24f3471
frontend:
  replicaCount: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 64Mi
  image:
    tag: sha-fc93b3bf3c15ebe5244e430e17102b9fd24f3471
catalog:
  replicaCount: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  image:
    tag: sha-fc93b3bf3c15ebe5244e430e17102b9fd24f3471
  autoscaling:
    minReplicas: 1
    maxReplicas: 2
query:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  image:
    tag: sha-fc93b3bf3c15ebe5244e430e17102b9fd24f3471
  autoscaling:
    minReplicas: 1
    maxReplicas: 2
worker:
  image:
    tag: sha-fc93b3bf3c15ebe5244e430e17102b9fd24f3471
# Dark deploy (2026-07-06): agent.enabled=true creates the pod so it can be
# observed running, but config.BI_AGENT_ENABLED stays "false" — the base
# chart's own default is "true" (see charts/agent/values.yaml), so this
# override is load-bearing, not redundant: without it the pod would start
# consuming real jobs in shadow mode the moment it exists. The switch an
# operator flips to start real traffic shadowing is config.BI_AGENT_ENABLED,
# below — it should be visible here, not just inherited silently.
agent:
  enabled: true
  image:
    tag: sha-ae4317fbd23fc6f01d88cef62307af9ef28fe875
  config:
    BI_AGENT_ENABLED: "false"
mcp:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 300m
      memory: 192Mi
  image:
    tag: sha-fc93b3bf3c15ebe5244e430e17102b9fd24f3471
  config:
    # MCP proxies tool calls to the API gateway; the hostname must match the
    # gateway HTTPRoutes (see global.gateway.hostnames).
    BI_API_SERVICE_URL: https://abi.il1.nl
  autoscaling:
    minReplicas: 1
    maxReplicas: 2
ai:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  image:
    tag: sha-fc93b3bf3c15ebe5244e430e17102b9fd24f3471
  rollout:
    enabled: false
  autoscaling:
    minReplicas: 1
    maxReplicas: 2
  config:
    # Provider/model selection (provider type, model ids, base URLs, API keys and
    # per-model tuning) is managed in the database via Administration → AI
    # Providers — NOT here. Only operational knobs below are environment-driven.
    BI_AI_TRANSLATION_TARGET_LANGUAGE: Turkish
    BI_AI_TRANSLATION_TARGET_CODE: tr
    BI_AI_TRANSLATION_HTTP_TIMEOUT_SECONDS: "120"
    BI_AI_RATE_LIMIT_PER_MINUTE: "20"
    BI_AI_MAX_PROMPT_RUNES: "40000"
    BI_AI_MAX_RETRIES: "1"
    BI_AI_DESCRIBE_MAX_CELL_RUNES: "500"
    BI_AI_DESCRIBE_MAX_SAMPLE_ROWS: "12"
    BI_AI_HTTP_TIMEOUT_SECONDS: "1200"
    BI_AI_EMBEDDING_HTTP_TIMEOUT_SECONDS: "1200"
    BI_AI_ROUTE_MAX_DIMENSIONS: "56"
    BI_AI_ROUTE_MAX_METRICS: "32"
    BI_AI_ROUTE_MAX_COLUMNS_PER_TABLE: "14"
    BI_AI_ROUTE_MAX_DATE_GRAIN_EXTRAS: "20"
    BI_AI_ROUTE_SLIM_NUMERIC_METRICS: "true"
    BI_AI_JOBS_ENABLED: "true"
    BI_NATS_URL: nats://biqly-nats:4222
  ambiguity:
    tieredEnabled: true
    maxLLMTierPerQuestion: 1
postgresql:
  # Migrated to the shared prag-postgresql instance (see
  # docs/superpowers/specs/2026-06-28-prag-shared-postgresql-design.md).
  # Disable the embedded subchart so the old biqly-postgresql StatefulSet is
  # no longer rendered/managed by this release.
  enabled: false
  primary:
    resources:
      requests:
        cpu: 50m
        memory: 192Mi
      limits:
        cpu: 500m
        memory: 384Mi
