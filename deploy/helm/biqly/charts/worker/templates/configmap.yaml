apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "worker.fullname" . }}-config
  labels:
    {{- include "worker.labels" . | nindent 4 }}
data:
  {{- /* Merge global + service config so a key defined in both renders once
         (service config wins). Two separate ranges emitted the same key twice,
         which Helm CLI tolerated but Flux's strict YAML parser rejects. */}}
  {{- $config := merge (deepCopy (.Values.config | default dict)) (.Values.global.config | default dict) }}
  {{- range $key, $value := $config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
