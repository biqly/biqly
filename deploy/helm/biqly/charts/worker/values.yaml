global:
  biqlyImageRegistry: ghcr.io/biqly
  imagePullSecrets: []
  registrySecret:
    create: false
    name: ghcr-registry
  serviceAccount:
    name: biqly
    automountServiceAccountToken: false
  secretNames:
    config: biqly-config
    db: biqly-db
    security: biqly-security
    authSecret: biqly-auth-secrets
  secrets:
    createSecrets: false
  deploymentStrategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

enabled: true
replicaCount: 2
image:
  repository: worker
  tag: latest
  pullPolicy: IfNotPresent
service:
  port: 8083
config:
  BI_HTTP_PORT: "8083"
  BI_AI_JOBS_ENABLED: "true"
  BI_AI_JOBS_CONSUMER_ENABLED: "true"
  BI_NATS_URL: nats://biqly-nats:4222
  BI_CATALOG_SERVICE_URL: http://biqly-catalog:8080
  BI_QUERY_SERVICE_URL: http://biqly-query:8081
  BI_AUTH_SERVICE_URL: http://biqly-auth:8889
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
