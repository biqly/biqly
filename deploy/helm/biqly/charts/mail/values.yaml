global:
  biqlyImageRegistry: ghcr.io/biqly
  imagePullSecrets: []
  registrySecret:
    create: false
    name: ghcr-registry
  serviceAccount:
    name: biqly
    automountServiceAccountToken: false
  secretNames:
    mailSecret: biqly-mail-secrets
    mailDB: biqly-mail-db
  secrets:
    createSecrets: true
    BI_MAIL_DB_DSN: ""
    BI_MAIL_INTERNAL_TOKEN: ""
    BI_MAIL_SMTP_USER: ""
    BI_MAIL_SMTP_PASS: ""

smtp:
  enabled: true

replicaCount: 1
image:
  repository: mail
  tag: latest
  pullPolicy: IfNotPresent
service:
  port: 8890
config:
  BI_MAIL_PORT: "8890"
  BI_MAIL_REDIS_DSN: "redis://biqly-dragonfly:6379"
  BI_MAIL_FRONTEND_BASE_URL: "https://abi.il1.nl"
  BI_MAIL_EMAIL_DEFAULT_LOCALE: "en"
  BI_MAIL_EMAIL_DAILY_LIMIT: "10"
  BI_MAIL_EMAIL_QUEUE_SIZE: "256"
  BI_MAIL_EMAIL_RETRIES: "3"
  BI_MAIL_SMTP_HOST: smtp.mail.me.com
  BI_MAIL_SMTP_PORT: "587"
  BI_MAIL_SMTP_FROM: no-reply@il1.nl
  BI_MAIL_SMTP_SENDER_NAME: "ABI"
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
podDisruptionBudget:
  enabled: false
  minAvailable: 1
migrate:
  enabled: true
  image:
    repository: mail
    tag: latest
    pullPolicy: IfNotPresent
  backoffLimit: 3
networkPolicy:
  enabled: true
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: auth
              app.kubernetes.io/part-of: biqly
  egress:
    db:
      enabled: true
      ports:
        - 5432
    redis:
      enabled: true
      ports:
        - 6379
    smtp:
      enabled: true
      ports:
        - 587
    otel:
      enabled: true
      # 4317/4318 reach the in-cluster collector gateway; 443 keeps the direct
      # remote path working when useInClusterCollector is off.
      ports:
        - 443
        - 4317
        - 4318
