{{- if .Values.global.secrets.createSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.secretNames.mailSecret }}
  labels:
    {{- include "mail.labels" . | nindent 4 }}
type: Opaque
stringData:
  BI_MAIL_INTERNAL_TOKEN: {{ required "global.secrets.BI_MAIL_INTERNAL_TOKEN is required" .Values.global.secrets.BI_MAIL_INTERNAL_TOKEN | quote }}
  {{- with .Values.global.secrets.BI_MAIL_SMTP_USER }}
  BI_MAIL_SMTP_USER: {{ . | quote }}
  {{- end }}
  {{- with .Values.global.secrets.BI_MAIL_SMTP_PASS }}
  BI_MAIL_SMTP_PASS: {{ . | quote }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.secretNames.mailDB }}
  labels:
    {{- include "mail.labels" . | nindent 4 }}
type: Opaque
stringData:
  BI_MAIL_DB_DSN: {{ required "global.secrets.BI_MAIL_DB_DSN is required" .Values.global.secrets.BI_MAIL_DB_DSN | quote }}
{{- end }}
