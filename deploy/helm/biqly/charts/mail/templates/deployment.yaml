apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mail.fullname" . }}
  labels:
    {{- include "mail.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "mail.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include "mail.configChecksum" . }}
        checksum/secret: {{ include "mail.secretChecksum" . }}
      labels:
        {{- include "mail.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "mail.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.global.serviceAccount.automountServiceAccountToken }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "mail.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "mail.fullname" . }}-config
          env:
            - name: BI_MAIL_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretNames.mailDB }}
                  key: BI_MAIL_DB_DSN
                  optional: false
            - name: BI_MAIL_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretNames.mailSecret }}
                  key: BI_MAIL_INTERNAL_TOKEN
                  optional: false
            {{- if .Values.smtp.enabled }}
            - name: BI_MAIL_SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretNames.mailSecret }}
                  key: BI_MAIL_SMTP_USER
                  optional: false
            - name: BI_MAIL_SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretNames.mailSecret }}
                  key: BI_MAIL_SMTP_PASS
                  optional: false
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
