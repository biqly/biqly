server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;



    # Public dashboard embeds: same SPA, framing allowed, never indexed.
    location /public/ {
        add_header X-Content-Type-Options "nosniff" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Content-Security-Policy "frame-ancestors *" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Referrer-Policy "strict-origin-when-cross-origin" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header X-Robots-Tag "noindex, nofollow" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        try_files $uri $uri/ /index.html;
    }

    location / {
        add_header X-Content-Type-Options "nosniff" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header X-Frame-Options "DENY" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Referrer-Policy "strict-origin-when-cross-origin" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|svg|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header X-Content-Type-Options "nosniff" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header X-Frame-Options "DENY" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Referrer-Policy "strict-origin-when-cross-origin" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        try_files $uri =404;
    }
}
