global:
  biqlyImageRegistry: ghcr.io/biqly
  imagePullSecrets: []
  registrySecret:
    create: false
    name: ghcr-registry
  serviceAccount:
    name: biqly
    automountServiceAccountToken: false
  secretNames:
    config: biqly-config
    db: biqly-db
    security: biqly-security
  config: {}
  secrets:
    BI_METADATA_DB_DSN: ""
    BI_ENCRYPTION_KEY: ""
    BI_INTERNAL_API_TOKEN: ""

replicaCount: 3
image:
  repository: query
  tag: latest
  pullPolicy: IfNotPresent
service:
  port: 8081
config:
  BI_HTTP_PORT: "8081"
  BI_CATALOG_SERVICE_URL: http://biqly-catalog:8080
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
route:
  enabled: true
  pathPrefixes:
    - /api/query
