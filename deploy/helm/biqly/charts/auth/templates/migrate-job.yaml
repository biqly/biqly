{{- if .Values.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "auth.fullname" . }}-migrate
  labels:
    {{- include "auth.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "-9"
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  template:
    metadata:
      labels:
        {{- /* Override component to "migrate" via a merge so the label isn't
               emitted twice (selectorLabels already sets it). A duplicate key
               is tolerated by Helm CLI but rejected by Flux's strict parser. */}}
        {{- toYaml (merge (dict "app.kubernetes.io/component" "migrate") (fromYaml (include "auth.selectorLabels" .))) | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "auth.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.global.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: {{ include "auth.migrateImage" . }}
          imagePullPolicy: {{ .Values.migrate.image.pullPolicy }}
          command: ["/auth-migrate"]
          args:
            - -dir
            - /migrations/auth
            - up
          env:
            - name: BI_AUTH_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretNames.authDB }}
                  key: BI_AUTH_DB_DSN
          resources:
            {{- toYaml .Values.global.migrate.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
{{- end }}
