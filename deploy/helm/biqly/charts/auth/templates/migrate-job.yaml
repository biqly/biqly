{{- if .Values.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "auth.fullname" . }}-migrate
  labels:
    {{- include "auth.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "auth.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "auth.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.global.serviceAccount.automountServiceAccountToken }}
      containers:
        - name: migrate
          image: {{ include "auth.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["./auth", "migrate", "up"]
          env:
            - name: BI_AUTH_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretNames.authDB }}
                  key: BI_AUTH_DB_DSN
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
