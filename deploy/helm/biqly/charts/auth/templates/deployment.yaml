apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "auth.fullname" . }}
  labels:
    {{- include "auth.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  {{- with .Values.global.deploymentStrategy }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .rollingUpdate.maxSurge | default 0 }}
      maxUnavailable: {{ .rollingUpdate.maxUnavailable | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "auth.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include "auth.configChecksum" . }}
        checksum/secret: {{ include "auth.secretChecksum" . }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.service.port | quote }}
        prometheus.io/path: /metrics
      labels:
        {{- include "auth.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "auth.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.global.serviceAccount.automountServiceAccountToken }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: postgres:18-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -d "$BI_AUTH_DB_DSN"; do
                sleep 2
              done
          envFrom:
            - secretRef:
                name: {{ .Values.global.secretNames.authDB }}
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
        {{- include "biqly.waitForOtelCollectorInitContainer" . | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "auth.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "auth.fullname" . }}-config
          env:
            - name: BI_AUTH_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretNames.authDB }}
                  key: BI_AUTH_DB_DSN
                  optional: false
            - name: BI_AUTH_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretNames.authSecret }}
                  key: BI_AUTH_ENCRYPTION_KEY
                  optional: false
            - name: BI_AUTH_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretNames.authSecret }}
                  key: BI_AUTH_INTERNAL_TOKEN
                  optional: false
            - name: BI_AUTH_MAIL_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretNames.mailSecret }}
                  key: BI_MAIL_INTERNAL_TOKEN
                  optional: true
            # Shared peer-service token so the sharing ownership guard can call
            # the catalog service's /internal/resource-datasource endpoint.
            - name: BI_INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretNames.security }}
                  key: BI_INTERNAL_API_TOKEN
                  optional: true
            - name: BI_AUTH_JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretNames.authSecret }}
                  key: BI_AUTH_JWT_PRIVATE_KEY
                  optional: false
            - name: BI_AUTH_GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.global.secretNames.authSecret }}
                  key: BI_AUTH_GITHUB_CLIENT_ID
                  optional: true
            - name: BI_AUTH_GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.global.secretNames.authSecret }}
                  key: BI_AUTH_GITHUB_CLIENT_SECRET
                  optional: true
            - name: BI_AUTH_GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.global.secretNames.authSecret }}
                  key: BI_AUTH_GOOGLE_CLIENT_ID
                  optional: true
            - name: BI_AUTH_GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.global.secretNames.authSecret }}
                  key: BI_AUTH_GOOGLE_CLIENT_SECRET
                  optional: true
            {{- include "biqly.otelEnv" (dict "root" $ "component" "auth") | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
