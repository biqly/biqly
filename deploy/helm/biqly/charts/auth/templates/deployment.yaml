apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "auth.fullname" . }}
  labels:
    {{- include "auth.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "auth.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include "auth.configChecksum" . }}
        checksum/secret: {{ include "auth.secretChecksum" . }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.service.port | quote }}
        prometheus.io/path: /metrics
      labels:
        {{- include "auth.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "auth.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.global.serviceAccount.automountServiceAccountToken }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "auth.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "auth.fullname" . }}-config
          env:
            - name: BI_AUTH_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretNames.authDB }}
                  key: BI_AUTH_DB_DSN
                  optional: false
            - name: BI_AUTH_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretNames.authSecret }}
                  key: BI_AUTH_ENCRYPTION_KEY
                  optional: false
            - name: BI_AUTH_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretNames.authSecret }}
                  key: BI_AUTH_INTERNAL_TOKEN
                  optional: false
            - name: BI_AUTH_JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretNames.authSecret }}
                  key: BI_AUTH_JWT_PRIVATE_KEY
                  optional: false
            {{- with .Values.global.secrets.BI_AUTH_GITHUB_CLIENT_SECRET }}
            - name: BI_AUTH_GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.global.secretNames.authSecret }}
                  key: BI_AUTH_GITHUB_CLIENT_SECRET
                  optional: true
            {{- end }}
            {{- with .Values.global.secrets.BI_AUTH_GOOGLE_CLIENT_SECRET }}
            - name: BI_AUTH_GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.global.secretNames.authSecret }}
                  key: BI_AUTH_GOOGLE_CLIENT_SECRET
                  optional: true
            {{- end }}
            {{- with .Values.global.secrets.BI_AUTH_SMTP_PASS }}
            - name: BI_AUTH_SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.global.secretNames.authSecret }}
                  key: BI_AUTH_SMTP_PASS
                  optional: true
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
