{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "auth.fullname" . }}
  labels:
    {{- include "auth.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "auth.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- range .Values.networkPolicy.ingress }}
    - from:
        {{- toYaml .from | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ $.Values.service.port }}
    {{- end }}
  egress:
    {{- if .Values.networkPolicy.egress.db.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: biqly-dragonfly
      ports:
        {{- range .Values.networkPolicy.egress.db.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
    {{- if .Values.networkPolicy.egress.redis.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: biqly-dragonfly
      ports:
        {{- range .Values.networkPolicy.egress.redis.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
    {{- if or .Values.networkPolicy.egress.oauth.enabled .Values.networkPolicy.egress.smtp.enabled }}
    - to: []
      ports:
        {{- if .Values.networkPolicy.egress.oauth.enabled }}
        {{- range .Values.networkPolicy.egress.oauth.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
        {{- end }}
        {{- if .Values.networkPolicy.egress.smtp.enabled }}
        {{- range .Values.networkPolicy.egress.smtp.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
        {{- end }}
    {{- end }}
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
{{- end }}
