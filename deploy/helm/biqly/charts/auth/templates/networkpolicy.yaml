{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "auth.fullname" . }}
  labels:
    {{- include "auth.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "auth.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- range .Values.networkPolicy.ingress }}
    - from:
        {{- toYaml .from | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ $.Values.service.port }}
    {{- end }}
  egress:
    {{- if .Values.networkPolicy.egress.db.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: primary
      ports:
        {{- range .Values.networkPolicy.egress.db.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
    {{- if .Values.networkPolicy.egress.redis.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: biqly-dragonfly
      ports:
        {{- range .Values.networkPolicy.egress.redis.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
    {{- if .Values.networkPolicy.egress.oauth.enabled }}
    - to: []
      ports:
        {{- range .Values.networkPolicy.egress.oauth.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
    {{- if and .Values.global.observability.tracing.enabled .Values.networkPolicy.egress.otel.enabled }}
    - to: []
      ports:
        {{- range .Values.networkPolicy.egress.otel.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
    {{- if .Values.networkPolicy.egress.mail.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: mail
              app.kubernetes.io/part-of: biqly
      ports:
        {{- range .Values.networkPolicy.egress.mail.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
    {{- if and .Values.networkPolicy.egress.ldap .Values.networkPolicy.egress.ldap.enabled }}
    - to:
        {{- with .Values.networkPolicy.egress.ldap.cidrs }}
        {{- range . }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
        {{- end }}
      ports:
        {{- range .Values.networkPolicy.egress.ldap.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
{{- end }}
