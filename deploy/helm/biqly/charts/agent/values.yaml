global:
  biqlyImageRegistry: ghcr.io/biqly
  imagePullSecrets: []
  registrySecret:
    create: false
    name: ghcr-registry
  serviceAccount:
    name: biqly
    automountServiceAccountToken: false
  secretNames:
    config: biqly-config
    db: biqly-db
    security: biqly-security
  secrets:
    createSecrets: false
  deploymentStrategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

# Disabled by default: the agentic query runner is a shadow/beta rollout
# (see internal/http/handlers/ai_job_service.go's routeAIJob) with nothing
# yet routing jobs to it. Enabling this subchart only starts the pods and
# its internal API — it does not, by itself, put the agent in the request
# path anywhere.
enabled: false
replicaCount: 2
image:
  repository: agent
  tag: latest
  pullPolicy: IfNotPresent
service:
  port: 8084
config:
  BI_HTTP_PORT: "8084"
  BI_NATS_URL: nats://biqly-nats:4222
  BI_NATS_CONSUMER_GROUP: biqly-agent-workers
  BI_CATALOG_SERVICE_URL: http://biqly-catalog:8080
  BI_AI_SERVICE_URL: http://biqly-ai:8082
  BI_QUERY_SERVICE_URL: http://biqly-query:8081
  BI_AGENT_ENABLED: "true"
  BI_AGENT_MODE: shadow
  BI_AGENT_MAX_STEPS: "6"
  BI_AGENT_MAX_CLARIFICATION_ROUNDS: "2"
  BI_AGENT_TIMEOUT: 45s
  BI_AGENT_MAX_ROWS: "1000"
  BI_AGENT_JOB_SUBJECT: biqly.agent.jobs
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
