apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "catalog.fullname" . }}
  labels:
    {{- include "catalog.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  {{- with .Values.global.deploymentStrategy }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .rollingUpdate.maxSurge | default 0 }}
      maxUnavailable: {{ .rollingUpdate.maxUnavailable | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "catalog.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include "catalog.configChecksum" . }}
        checksum/secret: {{ include "catalog.secretChecksum" . }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.service.port | quote }}
        prometheus.io/path: /metrics
      labels:
        {{- include "catalog.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "catalog.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.global.serviceAccount.automountServiceAccountToken }}
      {{- if or .Values.global.imagePullSecrets .Values.global.registrySecret.create }}
      imagePullSecrets:
        {{- with .Values.global.imagePullSecrets }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.global.registrySecret.create }}
        - name: {{ .Values.global.registrySecret.name }}
        {{- end }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: postgres:18-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -d "$BI_METADATA_DB_DSN"; do
                sleep 2
              done
          envFrom:
            - secretRef:
                name: {{ .Values.global.secretNames.db }}
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
        {{- include "biqly.waitForOtelCollectorInitContainer" . | nindent 8 }}
      containers:
        - name: catalog
          image: {{ include "catalog.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ .Values.global.secretNames.config }}
            - configMapRef:
                name: {{ include "catalog.fullname" . }}-config
            - secretRef:
                name: {{ .Values.global.secretNames.db }}
            - secretRef:
                name: {{ .Values.global.secretNames.security }}
          env:
            # Explicit env wins over the biqly-config envFrom, giving each
            # service its own OTEL service.name in SigNoz.
            - name: OTEL_SERVICE_NAME
              value: "biqly-catalog"
            # Shared internal token so the catalog service can authenticate to the
            # auth service's /internal/auth/public-key endpoint for JWT
            # verification (BI_AUTH_ENABLED=true).
            - name: BI_AUTH_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretNames.authSecret }}
                  key: BI_AUTH_INTERNAL_TOKEN
            {{- include "biqly.otelHeadersEnv" . | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
