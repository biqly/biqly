{{- if and .Values.global.gateway.enabled .Values.route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "catalog.fullname" . }}
  labels:
    {{- include "catalog.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.global.gateway.parentRef.name }}
      namespace: {{ .Values.global.gateway.parentRef.namespace }}
      {{- with .Values.global.gateway.parentRef.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  hostnames:
    {{- toYaml .Values.global.gateway.hostnames | nindent 4 }}
  rules:
    {{- range .Values.route.pathPrefixes }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ . | quote }}
      backendRefs:
        - name: {{ include "catalog.fullname" $ }}
          port: {{ $.Values.service.port }}
    {{- end }}
{{- end }}
