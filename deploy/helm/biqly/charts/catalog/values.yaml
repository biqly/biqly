global:
  biqlyImageRegistry: ghcr.io/biqly
  imagePullSecrets: []
  registrySecret:
    create: false
    name: ghcr-registry
  serviceAccount:
    name: biqly
    automountServiceAccountToken: false
  secretNames:
    config: biqly-config
    db: biqly-db
    security: biqly-security
  config: {}
  secrets:
    BI_METADATA_DB_DSN: ""
    BI_ENCRYPTION_KEY: ""
    BI_INTERNAL_API_TOKEN: ""
  gateway:
    enabled: true
    parentRef:
      name: lan-gw
      namespace: gateway
      sectionName: https
    hostnames:
      - abi.il1.nl

replicaCount: 2
image:
  repository: catalog
  tag: latest
  pullPolicy: IfNotPresent
service:
  port: 8080
config:
  BI_HTTP_PORT: "8080"
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 60
route:
  enabled: true
  pathPrefixes:
    - /api/datasources
    - /api/metadata
    - /api/semantic
    - /health
    - /ready
    - /metrics
