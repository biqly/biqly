global:
  biqlyImageRegistry: ghcr.io/biqly
  imagePullSecrets: []
  registrySecret:
    create: false
    name: ghcr-registry
  serviceAccount:
    name: biqly
    automountServiceAccountToken: false
  secretNames:
    config: biqly-config
    aiConfig: biqly-ai-config
    db: biqly-db
    security: biqly-security
    ai: biqly-ai-secrets
    embedding: biqly-embedding-secrets
    authSecret: biqly-auth-secrets
  config: {}
  secrets:
    BI_METADATA_DB_DSN: ""
    BI_ENCRYPTION_KEY: ""
    BI_INTERNAL_API_TOKEN: ""
    # AI provider API keys are stored encrypted in the database, not in secrets.

replicaCount: 2
image:
  repository: ai
  tag: latest
  pullPolicy: IfNotPresent
service:
  port: 8082
# Ambiguity & memory knobs are environment FALLBACKS: rows in the
# ai_runtime_config table (Administration → Platform Settings, or
# PUT /api/ai/admin/config) override them at runtime without a rollout.
ambiguity:
  tieredEnabled: true
  maxLLMTierPerQuestion: 1
memory:
  recallEnabled: true
  recallLimit: 5
config:
  BI_HTTP_PORT: "8082"
  BI_CATALOG_SERVICE_URL: http://biqly-catalog:8080
  BI_QUERY_SERVICE_URL: http://biqly-query:8081
  BI_AUTH_SERVICE_URL: http://biqly-auth:8889
  # AI provider/model selection is managed in the database (Administration →
  # AI Providers), not via environment variables.
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
route:
  enabled: true
  pathPrefixes:
    - /api/ai
rollout:
  enabled: false
  analysis:
    successRateThreshold: "0.95"
    llmLatencyThresholdSeconds: "30"
    prometheusAddress: http://kube-prometheus-stack-prometheus.monitoring:9090
  canary:
    steps:
      - setWeight: 20
      - pause:
          duration: 5m
      - setWeight: 50
      - pause:
          duration: 10m
      - setWeight: 100
