{{- if .Values.rollout.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ include "ai.fullname" . }}-success-rate
  labels:
    {{- include "ai.labels" . | nindent 4 }}
spec:
  metrics:
    - name: ai-success-rate
      interval: 1m
      count: 5
      successCondition: result[0] >= {{ .Values.rollout.analysis.successRateThreshold }}
      provider:
        prometheus:
          address: {{ .Values.rollout.analysis.prometheusAddress | quote }}
          query: |
            1 - (
              sum(rate(bi_ai_errors[5m]))
              /
              clamp_min(sum(rate(bi_ai_requests_total[5m])), 1)
            )
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ include "ai.fullname" . }}-llm-latency
  labels:
    {{- include "ai.labels" . | nindent 4 }}
spec:
  metrics:
    - name: ai-llm-latency
      interval: 1m
      count: 5
      successCondition: result[0] < {{ .Values.rollout.analysis.llmLatencyThresholdSeconds }}
      provider:
        prometheus:
          address: {{ .Values.rollout.analysis.prometheusAddress | quote }}
          query: |
            sum(rate(llm_request_duration_seconds[5m]))
            /
            clamp_min(sum(rate(bi_ai_requests_total[5m])), 1)
{{- end }}
