apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai.fullname" . }}-config
  labels:
    {{- include "ai.labels" . | nindent 4 }}
data:
  {{- /* Merge global + service config so a key defined in both renders once
         (service config wins). Two separate ranges emitted the same key twice,
         which Helm CLI tolerated but Flux's strict YAML parser rejects. */}}
  {{- $config := merge (deepCopy (.Values.config | default dict)) (.Values.global.config | default dict) }}
  {{- range $key, $value := $config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- with .Values.ambiguity }}
  BI_AI_AMBIGUITY_TIERED_ENABLED: {{ .tieredEnabled | toString | quote }}
  BI_AI_AMBIGUITY_MAX_LLM_TIER_PER_QUESTION: {{ .maxLLMTierPerQuestion | toString | quote }}
  {{- end }}
  {{- with .Values.memory }}
  BI_AI_MEMORY_RECALL_ENABLED: {{ .recallEnabled | toString | quote }}
  BI_AI_MEMORY_RECALL_LIMIT: {{ .recallLimit | toString | quote }}
  {{- end }}
