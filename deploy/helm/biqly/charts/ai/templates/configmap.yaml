apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai.fullname" . }}-config
  labels:
    {{- include "ai.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.global.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
