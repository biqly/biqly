apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcp.fullname" . }}
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  {{- with .Values.global.deploymentStrategy }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .rollingUpdate.maxSurge | default 0 }}
      maxUnavailable: {{ .rollingUpdate.maxUnavailable | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include "mcp.configChecksum" . }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.service.port | quote }}
        prometheus.io/path: /metrics
      labels:
        {{- include "mcp.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "mcp.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.global.serviceAccount.automountServiceAccountToken }}
      {{- if or .Values.global.imagePullSecrets .Values.global.registrySecret.create }}
      imagePullSecrets:
        {{- with .Values.global.imagePullSecrets }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.global.registrySecret.create }}
        - name: {{ .Values.global.registrySecret.name }}
        {{- end }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # No wait-for-postgres: the MCP service owns no database. It only needs
        # BI_METADATA_DB_DSN / BI_ENCRYPTION_KEY present so config.Load()
        # validates; it never opens a connection. It waits only for the OTel
        # collector so early logs/traces are not dropped.
        {{- include "biqly.waitForOtelCollectorInitContainer" . | nindent 8 }}
      containers:
        - name: mcp
          image: {{ include "mcp.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ .Values.global.secretNames.config }}
            - configMapRef:
                name: {{ include "mcp.fullname" . }}-config
            - secretRef:
                name: {{ .Values.global.secretNames.db }}
            - secretRef:
                name: {{ .Values.global.secretNames.security }}
          env:
            # Explicit OTEL service name so the MCP service is distinct in SigNoz.
            - name: OTEL_SERVICE_NAME
              value: "biqly-mcp"
            {{- include "biqly.otelHeadersEnv" . | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
