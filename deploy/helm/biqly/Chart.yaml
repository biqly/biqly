apiVersion: v2
name: biqly
description: Biqly microservice umbrella chart
type: application
version: 0.1.0
appVersion: "0.1.0"
dependencies:
  - name: postgresql
    version: 18.6.7
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: catalog
    version: 0.1.0
    repository: file://charts/catalog
  - name: query
    version: 0.1.0
    repository: file://charts/query
  - name: mcp
    version: 0.1.0
    repository: file://charts/mcp
    condition: mcp.enabled
  - name: ai
    version: 0.1.0
    repository: file://charts/ai
  - name: worker
    version: 0.1.0
    repository: file://charts/worker
    condition: worker.enabled
  - name: agent
    version: 0.1.0
    repository: file://charts/agent
    condition: agent.enabled
  - name: auth
    version: 0.1.0
    repository: file://charts/auth
    condition: auth.enabled
  - name: mail
    version: 0.1.0
    repository: file://charts/mail
    condition: mail.enabled
  - name: frontend
    version: 0.1.0
    repository: file://charts/frontend
    condition: frontend.enabled
