# For a comprehensive list of environment variables and dynamic database overrides,
# see docs/configuration.md.
global:
  namespace:
    create: true
    name: biqly
    labels:
      name: biqly
      pod-security.kubernetes.io/enforce: restricted
      pod-security.kubernetes.io/audit: restricted
      pod-security.kubernetes.io/warn: restricted
  biqlyImageRegistry: ghcr.io/biqly
  imagePullSecrets: []
  registrySecret:
    create: false
    name: ghcr-registry
    dockerconfigjson: ""
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
  reflectedTLSSecret:
    create: false
    name: wildcard-il1-nl-tls
    type: kubernetes.io/tls
    annotations: {}
    tlsCrt: ""
    tlsKey: ""
  namespaceOverride: ""
  gateway:
    enabled: true
    # Envoy Gateway (envoy-gateway-system/eg-gw) terminates LAN HTTP/HTTPS.
    # Single parentRef — both listeners are on the same Gateway resource.
    parentRef:
      name: eg-gw
      namespace: envoy-gateway-system
    hostnames:
      - abi.il1.nl
    redirect:
      enabled: false
      scheme: https
      statusCode: 301
  apiVIP:
    # Legacy Cilium LBIPAM VIP; superseded by Envoy Gateway (192.168.0.160).
    enabled: false
    name: biqly-api-vip
    ip: 192.168.0.160
    annotations:
      io.cilium/lb-ipam-ips: 192.168.0.160
    port: 443
    targetPort: 8080
  networkPolicy:
    enabled: true
    dns:
      enabled: true
      kubeDNSNamespace: kube-system
      kubeDNSLabels:
        k8s-app: kube-dns
    gateway:
      enabled: true
    metadata:
      enabled: true
      ports:
        postgres: 5432
        redis: 6379
    queryUserDbs:
      enabled: false
      cidrs: []
      ports:
        - 5432
        - 3306
        - 1433
        - 8123
        - 9000
    otelCollectorUpstream:
      # Egress from biqly-otel-infra-collector to the remote OTLP backend (kibrit
      # over Tailscale in prod). Set cidrs in values-prod.yaml.
      enabled: true
      cidrs: []
      ports:
        - 4318
    sharedPostgresql:
      # Egress for components talking to an out-of-chart shared PostgreSQL
      # instance (e.g. the prag-postgresql migration). Disabled by default;
      # enable + set instanceName/namespace once a shared instance is in use.
      enabled: false
      namespace: postgresql
      instanceName: prag-postgresql
      components:
        - agent
        - ai
        - auth
        - catalog
        - mail
        - migrate
        - query
        - worker
    aiExternal:
      enabled: true
      # HTTPS to any host (OpenAI-compatible gateways, CDNs with rotating IPs).
      # Prefer this over toFQDNs alone — FQDN rules miss alternate A records.
      allowWorldHTTPS: true
      worldPorts:
        - 443
      # Optional extra toFQDNs (redundant when allowWorldHTTPS is true).
      fqdnNames: []
      fqdnMatchPatterns: []
      fqdnPorts:
        - 443
      cidrs: []
      cidrPorts:
        - 11434
      # In-cluster egress to the auth service (JWT public key + per-user AI
      # model access/preferences via /internal/auth/*).
      authService:
        enabled: true
        port: 8889
  migrate:
    enabled: true
    image:
      repository: migrate
      tag: latest
      pullPolicy: IfNotPresent
    backoffLimit: 3
    # Low requests: PreSync hooks must schedule on a nearly-full single node (prag).
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
  backup:
    enabled: false
    schedule: "0 2 * * *"
    image: postgres:18-alpine
    s3:
      bucket: ""
      endpoint: ""
  postgresqlVIP:
    enabled: false
    name: biqly-postgresql-vip
    ip: 192.168.0.164
    port: 5432
    annotations:
      io.cilium/lb-ipam-ips: "192.168.0.164"
  dragonfly:
    enabled: true
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.38.1
    service:
      port: 6379
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
  nats:
    enabled: true
    image: nats:2.12.6-alpine
    service:
      clientPort: 4222
      monitorPort: 8222
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  serviceAccount:
    create: true
    name: biqly
    automountServiceAccountToken: false
  secretNames:
    config: biqly-config
    otel: biqly-otel-secrets
    aiConfig: biqly-ai-config
    db: biqly-db
    security: biqly-security
    ai: biqly-ai-secrets
    embedding: biqly-embedding-secrets
    mailSecret: biqly-mail-secrets
    mailDB: biqly-mail-db
    authSecret: biqly-auth-secrets
  config:
    BI_LOG_LEVEL: info
    BI_LOG_FORMAT: json
    BI_QUERY_TIMEOUT_SECONDS: "30"
    BI_QUERY_MAX_ROWS: "10000"
    BI_QUERY_MAX_RUNTIME_SECONDS: "60"
    BI_REDIS_DSN: redis://biqly-dragonfly:6379
    BI_AUTH_ENABLED: "true"
    # Every JWT-enforcing service needs the auth service URL to fetch the JWT
    # public key — without it BI_AUTH_ENABLED=true makes /api answer 503.
    BI_AUTH_SERVICE_URL: http://biqly-auth:8889
    # PII detection & role-based masking (see docs/pii-detection-masking.md)
    BI_PII_ENABLED: "true"
    BI_PII_DETECTION_THRESHOLD: "0.6"
    BI_PII_SAMPLE_DATA_LIMIT: "50"
    BI_PII_AUTO_SCAN_ON_SYNC: "true"
    BI_PII_DEFAULT_MASKING_STRATEGY: partial
  secrets:
    createSecrets: true
    BI_METADATA_DB_DSN: ""
    BI_ENCRYPTION_KEY: ""
    BI_INTERNAL_API_TOKEN: ""
    # AI provider API keys are stored encrypted in the database, not in secrets.
  observability:
    serviceMonitor:
      enabled: true
      namespace: monitoring
      interval: 30s
      scrapeTimeout: 10s
      labels:
        release: kube-prometheus-stack
    dashboards:
      enabled: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: biqly
    prometheusRules:
      enabled: true
      labels:
        release: kube-prometheus-stack
    logs:
      vectorConfig:
        enabled: true
    tracing:
      # App-side OTLP export (biqly-config + biqly.otelEnv).
      enabled: true
      serviceName: biqly
      # Remote backend (SigNoz OTLP ingest on kibrit, reachable over Tailscale).
      # With useInClusterCollector the apps DO NOT export here directly — the
      # in-cluster collector forwards to it.
      otlpEndpoint: http://100.84.49.60:4318
      # Apps export to the in-cluster collector (gateway) over a fast in-cluster
      # hop, so the remote (Cloudflare) round-trip never touches the request
      # path. The collector absorbs remote latency with its queue + retry.
      useInClusterCollector: true
      collectorEndpoint: http://biqly-otel-infra-collector:4318
      # Set true to skip the wait-for-otel-collector init container (e.g. if the
      # in-cluster collector is unreliable/unreachable and shouldn't block app startup).
      skipCollectorWait: false
      sampler: parentbased_traceidratio
      samplerArg: "0.25"
      otlpHeadersSecret:
        name: biqly-otel-secrets
        key: OTEL_EXPORTER_OTLP_HEADERS
      # Set create: true + OTEL_EXPORTER_OTLP_HEADERS only for local/dev; prod uses a pre-created secret.
      otelSecret:
        create: false
        OTEL_EXPORTER_OTLP_HEADERS: ""
    # Infra telemetry: an in-namespace OTel Collector that forwards METRICS from
    # the bundled data stores (PostgreSQL, Dragonfly, NATS) to the same OTLP
    # backend the apps export traces to (reuses tracing.otlpEndpoint and the
    # tracing.otlpHeadersSecret bearer token). These stores emit metrics, not
    # spans, so this is a metrics pipeline. Toggle the whole feature with
    # `enabled`; toggle each source independently.
    infraTelemetry:
      enabled: true
      image: otel/opentelemetry-collector-contrib:0.153.0
      collectionInterval: 30s
      # deployment.environment resource attribute stamped on app traces/logs.
      # Override per environment (e.g. "development" in values-dev.yaml).
      deploymentEnvironment: production
      # Enrich app traces/logs with Kubernetes metadata (namespace/pod/deployment/
      # node names) via the k8sattributes processor so they are filterable in the
      # backend. Adds a cluster-wide read-only ClusterRole for the collector SA.
      k8sAttributes:
        enabled: true
      # OTLP target. Empty string falls back to observability.tracing.otlpEndpoint.
      otlpEndpoint: ""
      # Bearer token source. Empty falls back to tracing.otlpHeadersSecret.
      otlpHeadersSecret:
        name: ""
        key: ""
      resources:
        requests:
          cpu: 50m
          memory: 96Mi
        limits:
          cpu: 300m
          memory: 256Mi
      postgresql:
        enabled: true
        service: biqly-postgresql
        port: 5432
        username: postgres
        passwordSecret:
          name: biqly-postgresql-auth
          key: postgres-password
      dragonfly:
        enabled: true
        target: biqly-dragonfly:6379
      nats:
        enabled: true
        monitorURL: http://biqly-nats:8222
        exporterImage: natsio/prometheus-nats-exporter:0.17.3
        exporterPort: 7777
    alertmanager:
      enabled: false
      webhookURLSecret:
        name: biqly-alertmanager-webhook
        key: url

postgresql:
  enabled: true
  fullnameOverride: biqly-postgresql
  auth:
    username: biqly
    database: bi_metadata
    existingSecret: biqly-postgresql-auth
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password
  architecture: standalone
  primary:
    persistence:
      enabled: true
      size: 20Gi
      resourcePolicy: keep
    networkPolicy:
      enabled: true
      allowExternal: false

catalog:
  enabled: true
  replicaCount: 2
  image:
    repository: catalog
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8080
  config:
    BI_HTTP_PORT: "8080"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 60
  route:
    enabled: true
    pathPrefixes:
      - /api/datasources
      - /api/metadata
      - /api/semantic
      - /api/drift
      - /api/permissions
      - /api/dashboards
      - /health
      - /ready
      - /metrics

query:
  enabled: true
  replicaCount: 3
  image:
    repository: query
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8081
  config:
    BI_HTTP_PORT: "8081"
    BI_CATALOG_SERVICE_URL: http://biqly-catalog:8080
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  route:
    enabled: true
    pathPrefixes:
      - /api/query
      - /api/audit/query
    # Envoy's default route timeout is 15s; logical-query compile+execute can
    # legitimately exceed it (BI_QUERY_TIMEOUT_SECONDS budget + overhead).
    timeouts:
      request: 120s

mcp:
  enabled: true
  replicaCount: 2
  image:
    repository: mcp
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8083
  config:
    BI_HTTP_PORT: "8083"
    # Set to the API gateway base URL (must carry the gateway hostname so the
    # HTTPRoutes match) — see values-prod.yaml.
    BI_API_SERVICE_URL: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  route:
    enabled: true
    pathPrefixes:
      - /mcp
    # An MCP tool call synchronously runs the AI/query pipeline upstream; the
    # service's own middleware budget is BI_AI_*_TIMEOUT + headroom (~20min in
    # prod), so the gateway must not cut it at Envoy's 15s default.
    timeouts:
      request: 1800s

auth:
  enabled: true
  replicaCount: 1
  image:
    repository: auth
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8889
  config:
    BI_AUTH_PORT: "8889"
    BI_AUTH_REDIS_DSN: "redis://biqly-dragonfly:6379"
    BI_AUTH_MAIL_SERVICE_URL: "http://biqly-mail:8890"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 60
  route:
    enabled: true
    pathPrefixes:
      - /api/auth

mail:
  enabled: true
  replicaCount: 1
  image:
    repository: mail
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8890
  smtp:
    enabled: true
  config:
    BI_MAIL_PORT: "8890"
    BI_MAIL_REDIS_DSN: "redis://biqly-dragonfly:6379"
    BI_MAIL_FRONTEND_BASE_URL: "https://abi.il1.nl"
    BI_MAIL_EMAIL_DEFAULT_LOCALE: "en"
    BI_MAIL_EMAIL_DAILY_LIMIT: "10"
    BI_MAIL_EMAIL_QUEUE_SIZE: "256"
    BI_MAIL_EMAIL_RETRIES: "3"
    BI_MAIL_SMTP_HOST: smtp.mail.me.com
    BI_MAIL_SMTP_PORT: "587"
    BI_MAIL_SMTP_FROM: no-reply@il1.nl
    BI_MAIL_SMTP_SENDER_NAME: "ABI"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8080
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  route:
    enabled: true
    pathPrefixes:
      - /

ai:
  enabled: true
  replicaCount: 2
  image:
    repository: ai
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8082
  ambiguity:
    tieredEnabled: true
    maxLLMTierPerQuestion: 1
  config:
    BI_HTTP_PORT: "8082"
    BI_AI_JOBS_CONSUMER_ENABLED: "false"
    BI_CATALOG_SERVICE_URL: http://biqly-catalog:8080
    BI_QUERY_SERVICE_URL: http://biqly-query:8081
    BI_AUTH_SERVICE_URL: http://biqly-auth:8889
    # Web agent tools loop back through the API gateway (same pattern as MCP's
    # BI_API_SERVICE_URL below) — must carry the gateway hostname so the
    # HTTPRoutes match; set per environment. Without this, webAgentDispatcher
    # is never wired and /api/agent/chat fails with "web agent runtime is not
    # configured".
    BI_API_SERVICE_URL: ""
    # AI provider/model selection is managed in the database (Administration →
    # AI Providers), not via environment variables.
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  route:
    enabled: true
    pathPrefixes:
      - /api/ai
      - /api/agent
    # MCP run_question loops back through the gateway to /api/ai/query/run and
    # the AI pipeline can run for minutes; Envoy's 15s default would 504 it.
    timeouts:
      request: 1800s
  rollout:
    enabled: false
    analysis:
      successRateThreshold: "0.95"
      llmLatencyThresholdSeconds: "30"
      prometheusAddress: http://kube-prometheus-stack-prometheus.monitoring:9090
    canary:
      steps:
        - setWeight: 20
        - pause:
            duration: 5m
        - setWeight: 50
        - pause:
            duration: 10m
        - setWeight: 100

worker:
  enabled: true
  replicaCount: 2
  image:
    repository: worker
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8083
  config:
    BI_HTTP_PORT: "8083"
    BI_AI_JOBS_ENABLED: "true"
    BI_AI_JOBS_CONSUMER_ENABLED: "true"
    BI_NATS_URL: nats://biqly-nats:4222
    BI_CATALOG_SERVICE_URL: http://biqly-catalog:8080
    BI_QUERY_SERVICE_URL: http://biqly-query:8081
    BI_AUTH_SERVICE_URL: http://biqly-auth:8889
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70

# Agentic query runner (NATS-driven planner/tool-execution pipeline). Disabled
# by default — see charts/agent/values.yaml for why enabling this alone does
# not put the agent in any request path.
agent:
  enabled: false
  replicaCount: 2
  image:
    repository: agent
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8084
  config:
    BI_HTTP_PORT: "8084"
    BI_NATS_URL: nats://biqly-nats:4222
    BI_CATALOG_SERVICE_URL: http://biqly-catalog:8080
    BI_AI_SERVICE_URL: http://biqly-ai:8082
    BI_QUERY_SERVICE_URL: http://biqly-query:8081
    BI_AGENT_ENABLED: "true"
    BI_AGENT_MODE: shadow
    BI_AGENT_MAX_STEPS: "6"
    BI_AGENT_MAX_CLARIFICATION_ROUNDS: "2"
    BI_AGENT_TIMEOUT: 45s
    BI_AGENT_MAX_ROWS: "1000"
    BI_AGENT_JOB_SUBJECT: biqly.agent.jobs
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
