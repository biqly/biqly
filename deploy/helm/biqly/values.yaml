global:
  namespace:
    create: true
    name: biqly
    labels:
      name: biqly
      pod-security.kubernetes.io/enforce: restricted
      pod-security.kubernetes.io/audit: restricted
      pod-security.kubernetes.io/warn: restricted
  biqlyImageRegistry: ghcr.io/biqly
  imagePullSecrets: []
  registrySecret:
    create: false
    name: ghcr-registry
    dockerconfigjson: ""
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
  reflectedTLSSecret:
    create: false
    name: wildcard-il1-nl-tls
    type: kubernetes.io/tls
    annotations: {}
    tlsCrt: ""
    tlsKey: ""
  namespaceOverride: ""
  gateway:
    enabled: true
    parentRef:
      name: lan-gw
      namespace: gateway
      sectionName: https
    httpParentRef:
      name: lan-gw
      namespace: gateway
      sectionName: http
    hostnames:
      - abi.il1.nl
    redirect:
      enabled: false
      scheme: https
      statusCode: 301
  apiVIP:
    enabled: false
    name: biqly-api-vip
    ip: 192.168.0.160
    annotations:
      io.cilium/lb-ipam-ips: 192.168.0.160
    port: 443
    targetPort: 8080
  networkPolicy:
    enabled: true
    dns:
      enabled: true
      kubeDNSNamespace: kube-system
      kubeDNSLabels:
        k8s-app: kube-dns
    gateway:
      enabled: true
    metadata:
      enabled: true
      ports:
        postgres: 5432
        redis: 6379
    queryUserDbs:
      enabled: false
      cidrs: []
      ports:
        - 5432
        - 3306
        - 1433
        - 8123
        - 9000
    otelCollectorUpstream:
      # Egress from biqly-otel-infra-collector to the remote OTLP backend (kibrit
      # over Tailscale in prod). Set cidrs in values-prod.yaml.
      enabled: true
      cidrs: []
      ports:
        - 4318
    aiExternal:
      enabled: true
      # HTTPS to any host (OpenAI-compatible gateways, CDNs with rotating IPs).
      # Prefer this over toFQDNs alone — FQDN rules miss alternate A records.
      allowWorldHTTPS: true
      worldPorts:
        - 443
      # Optional extra toFQDNs (redundant when allowWorldHTTPS is true).
      fqdnNames: []
      fqdnMatchPatterns: []
      fqdnPorts:
        - 443
      cidrs: []
      cidrPorts:
        - 11434
      # In-cluster egress to the auth service (JWT public key + per-user AI
      # model access/preferences via /internal/auth/*).
      authService:
        enabled: true
        port: 8889
  migrate:
    enabled: true
    image:
      repository: migrate
      tag: latest
      pullPolicy: IfNotPresent
    backoffLimit: 3
  backup:
    enabled: false
    schedule: "0 2 * * *"
    image: postgres:18-alpine
    s3:
      bucket: ""
      endpoint: ""
  postgresqlVIP:
    enabled: false
    name: biqly-postgresql-vip
    ip: 192.168.0.164
    port: 5432
    annotations:
      io.cilium/lb-ipam-ips: "192.168.0.164"
  dragonfly:
    enabled: true
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.38.1
    service:
      port: 6379
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
  nats:
    enabled: true
    image: nats:2.12.6-alpine
    service:
      clientPort: 4222
      monitorPort: 8222
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  serviceAccount:
    create: true
    name: biqly
    automountServiceAccountToken: false
  secretNames:
    config: biqly-config
    otel: biqly-otel-secrets
    aiConfig: biqly-ai-config
    db: biqly-db
    security: biqly-security
    ai: biqly-ai-secrets
    embedding: biqly-embedding-secrets
    mailSecret: biqly-mail-secrets
    mailDB: biqly-mail-db
    authSecret: biqly-auth-secrets
  config:
    BI_LOG_LEVEL: info
    BI_LOG_FORMAT: json
    BI_QUERY_TIMEOUT_SECONDS: "30"
    BI_QUERY_MAX_ROWS: "10000"
    BI_QUERY_MAX_RUNTIME_SECONDS: "60"
    BI_REDIS_DSN: redis://biqly-dragonfly:6379
    BI_AUTH_ENABLED: "true"
    # Every JWT-enforcing service needs the auth service URL to fetch the JWT
    # public key — without it BI_AUTH_ENABLED=true makes /api answer 503.
    BI_AUTH_SERVICE_URL: http://biqly-auth:8889
    # PII detection & role-based masking (see docs/pii-detection-masking.md)
    BI_PII_ENABLED: "true"
    BI_PII_DETECTION_THRESHOLD: "0.6"
    BI_PII_SAMPLE_DATA_LIMIT: "50"
    BI_PII_AUTO_SCAN_ON_SYNC: "true"
    BI_PII_DEFAULT_MASKING_STRATEGY: partial
  secrets:
    createSecrets: true
    BI_METADATA_DB_DSN: ""
    BI_ENCRYPTION_KEY: ""
    BI_INTERNAL_API_TOKEN: ""
    # AI provider API keys are stored encrypted in the database, not in secrets.
  observability:
    serviceMonitor:
      enabled: true
      namespace: monitoring
      interval: 30s
      scrapeTimeout: 10s
      labels:
        release: kube-prometheus-stack
    dashboards:
      enabled: true
      labels:
        grafana_dashboard: "1"
    prometheusRules:
      enabled: true
      labels:
        release: kube-prometheus-stack
    logs:
      vectorConfig:
        enabled: true
    tracing:
      # App-side OTLP export (biqly-config + biqly.otelEnv).
      enabled: true
      serviceName: biqly
      # Remote backend. With useInClusterCollector the apps DO NOT export here
      # directly — the in-cluster collector forwards to it with the bearer token.
      otlpEndpoint: http://biqly-otel-collector:4318
      # Apps export to the in-cluster collector (gateway) over a fast in-cluster
      # hop, so the remote (Cloudflare) round-trip never touches the request
      # path. The collector absorbs remote latency with its queue + retry.
      useInClusterCollector: true
      collectorEndpoint: http://biqly-otel-infra-collector:4318
      sampler: parentbased_traceidratio
      samplerArg: "0.25"
      otlpHeadersSecret:
        name: biqly-otel-secrets
        key: OTEL_EXPORTER_OTLP_HEADERS
      # Set create: true + OTEL_EXPORTER_OTLP_HEADERS only for local/dev; prod uses a pre-created secret.
      otelSecret:
        create: false
        OTEL_EXPORTER_OTLP_HEADERS: ""
      otelCollector:
        enabled: true
        image: otel/opentelemetry-collector-contrib:0.153.0
      jaeger:
        enabled: true
        image: jaegertracing/all-in-one:1.76.0
    # Infra telemetry: an in-namespace OTel Collector that forwards METRICS from
    # the bundled data stores (PostgreSQL, Dragonfly, NATS) to the same OTLP
    # backend the apps export traces to (reuses tracing.otlpEndpoint and the
    # tracing.otlpHeadersSecret bearer token). These stores emit metrics, not
    # spans, so this is a metrics pipeline. Toggle the whole feature with
    # `enabled`; toggle each source independently.
    infraTelemetry:
      enabled: true
      image: otel/opentelemetry-collector-contrib:0.153.0
      collectionInterval: 30s
      # OTLP target. Empty string falls back to observability.tracing.otlpEndpoint.
      otlpEndpoint: ""
      # Bearer token source. Empty falls back to tracing.otlpHeadersSecret.
      otlpHeadersSecret:
        name: ""
        key: ""
      resources:
        requests:
          cpu: 50m
          memory: 96Mi
        limits:
          cpu: 300m
          memory: 256Mi
      postgresql:
        enabled: true
        service: biqly-postgresql
        port: 5432
        username: postgres
        passwordSecret:
          name: biqly-postgresql-auth
          key: postgres-password
      dragonfly:
        enabled: true
        target: biqly-dragonfly:6379
      nats:
        enabled: true
        monitorURL: http://biqly-nats:8222
        exporterImage: natsio/prometheus-nats-exporter:0.17.3
        exporterPort: 7777
    alertmanager:
      enabled: false
      webhookURLSecret:
        name: biqly-alertmanager-webhook
        key: url

postgresql:
  enabled: true
  fullnameOverride: biqly-postgresql
  auth:
    username: biqly
    database: bi_metadata
    existingSecret: biqly-postgresql-auth
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password
  architecture: standalone
  primary:
    persistence:
      enabled: true
      size: 20Gi
      resourcePolicy: keep
    networkPolicy:
      enabled: true
      allowExternal: false

catalog:
  enabled: true
  replicaCount: 2
  image:
    repository: catalog
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8080
  config:
    BI_HTTP_PORT: "8080"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 60
  route:
    enabled: true
    pathPrefixes:
      - /api/datasources
      - /api/metadata
      - /api/semantic
      - /api/permissions
      - /api/dashboards
      - /health
      - /ready
      - /metrics

query:
  enabled: true
  replicaCount: 3
  image:
    repository: query
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8081
  config:
    BI_HTTP_PORT: "8081"
    BI_CATALOG_SERVICE_URL: http://biqly-catalog:8080
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  route:
    enabled: true
    pathPrefixes:
      - /api/query

auth:
  enabled: true
  replicaCount: 1
  image:
    repository: auth
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8889
  config:
    BI_AUTH_PORT: "8889"
    BI_AUTH_REDIS_DSN: "redis://biqly-dragonfly:6379"
    BI_AUTH_MAIL_SERVICE_URL: "http://biqly-mail:8890"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 60
  route:
    enabled: true
    pathPrefixes:
      - /api/auth

mail:
  enabled: true
  replicaCount: 1
  image:
    repository: mail
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8890
  smtp:
    enabled: true
  config:
    BI_MAIL_PORT: "8890"
    BI_MAIL_REDIS_DSN: "redis://biqly-dragonfly:6379"
    BI_MAIL_FRONTEND_BASE_URL: "https://abi.il1.nl"
    BI_MAIL_EMAIL_DEFAULT_LOCALE: "en"
    BI_MAIL_EMAIL_DAILY_LIMIT: "10"
    BI_MAIL_EMAIL_QUEUE_SIZE: "256"
    BI_MAIL_EMAIL_RETRIES: "3"
    BI_MAIL_SMTP_HOST: smtp.mail.me.com
    BI_MAIL_SMTP_PORT: "587"
    BI_MAIL_SMTP_FROM: no-reply@il1.nl
    BI_MAIL_SMTP_SENDER_NAME: "ABI"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8080
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  route:
    enabled: true
    pathPrefixes:
      - /

ai:
  enabled: true
  replicaCount: 2
  image:
    repository: ai
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8082
  config:
    BI_HTTP_PORT: "8082"
    BI_CATALOG_SERVICE_URL: http://biqly-catalog:8080
    BI_QUERY_SERVICE_URL: http://biqly-query:8081
    BI_AUTH_SERVICE_URL: http://biqly-auth:8889
    BI_AI_AMBIGUITY_TIERED_ENABLED: "true"
    # AI provider/model selection is managed in the database (Administration →
    # AI Providers), not via environment variables.
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  route:
    enabled: true
    pathPrefixes:
      - /api/ai
  rollout:
    enabled: false
    analysis:
      successRateThreshold: "0.95"
      llmLatencyThresholdSeconds: "30"
      prometheusAddress: http://kube-prometheus-stack-prometheus.monitoring:9090
    canary:
      steps:
        - setWeight: 20
        - pause:
            duration: 5m
        - setWeight: 50
        - pause:
            duration: 10m
        - setWeight: 100
