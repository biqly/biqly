{{- if .Values.global.observability.dashboards.enabled }}
{{- $ds := "{\"type\":\"prometheus\",\"uid\":\"prometheus\"}" -}}
{{- $stepAvg := "sum by (step) (rate(bi_ai_step_duration_seconds_sum[5m])) / clamp_min(sum by (step) (rate(bi_ai_step_duration_seconds_count[5m])), 1)" -}}
{{- $stepP95 := "histogram_quantile(0.95, sum by (le, step) (rate(bi_ai_step_duration_seconds_bucket[5m])))" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: biqly-grafana-dashboards
  labels:
    {{- include "biqly.labels" . | nindent 4 }}
    {{- toYaml .Values.global.observability.dashboards.labels | nindent 4 }}
  {{- with .Values.global.observability.dashboards.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  biqly-ai.json: |
    {
      "title": "Biqly AI",
      "uid": "biqly-ai",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": {"from": "now-6h", "to": "now"},
      "tags": ["biqly", "ai"],
      "panels": [
        {"type":"row","title":"Genel bakış","gridPos":{"h":1,"w":24,"x":0,"y":0},"collapsed":false},
        {"type":"stat","title":"İstek / dk","gridPos":{"h":4,"w":6,"x":0,"y":1},"fieldConfig":{"defaults":{"unit":"reqpm","decimals":1}},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"sum(rate(bi_ai_requests_total[5m])) * 60"}]},
        {"type":"stat","title":"Başarı oranı","gridPos":{"h":4,"w":6,"x":6,"y":1},"fieldConfig":{"defaults":{"unit":"percentunit","min":0,"max":1,"thresholds":{"mode":"absolute","steps":[{"color":"red","value":null},{"color":"yellow","value":0.9},{"color":"green","value":0.95}]}}},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"1 - (sum(rate(bi_ai_errors_total[5m])) / clamp_min(sum(rate(bi_ai_requests_total[5m])), 1))"}]},
        {"type":"stat","title":"p95 uçtan uca (s)","gridPos":{"h":4,"w":6,"x":12,"y":1},"fieldConfig":{"defaults":{"unit":"s","decimals":2}},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"histogram_quantile(0.95, sum(rate(bi_ai_request_duration_seconds_bucket[5m])) by (le))"}]},
        {"type":"stat","title":"Token / s","gridPos":{"h":4,"w":6,"x":18,"y":1},"fieldConfig":{"defaults":{"unit":"short","decimals":0}},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"sum(rate(llm_tokens_used_total[5m]))"}]},
        {"type":"row","title":"Soru pipeline — hangi adımda ne kadar bekliyor?","gridPos":{"h":1,"w":24,"x":0,"y":5},"collapsed":false},
        {"type":"timeseries","title":"Ortalama adım süresi (s)","description":"Her AI isteğinde ölçülen pipeline adımları: tablo yönlendirme, prompt hazırlığı, LLM çağrısı, doğrulama, SQL dry-run, derleme/çalıştırma.","gridPos":{"h":9,"w":24,"x":0,"y":6},"fieldConfig":{"defaults":{"unit":"s"}},"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["mean","max","last"]}},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"{{ $stepAvg }}","legendFormat":"{{ "{{step}}" }}"}]},
        {"type":"timeseries","title":"p95 adım süresi (s)","gridPos":{"h":8,"w":12,"x":0,"y":15},"fieldConfig":{"defaults":{"unit":"s"}},"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["max","last"]}},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"{{ $stepP95 }}","legendFormat":"{{ "{{step}}" }}"}]},
        {"type":"barchart","title":"Adım süre payı (ortalama)","gridPos":{"h":8,"w":12,"x":12,"y":15},"fieldConfig":{"defaults":{"unit":"s"}},"options":{"orientation":"horizontal","legend":{"displayMode":"list","placement":"bottom"}},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"{{ $stepAvg }}","legendFormat":"{{ "{{step}}" }}"}]},

        {"type":"row","title":"LLM & prompt","gridPos":{"h":1,"w":24,"x":0,"y":23},"collapsed":false},
        {"type":"timeseries","title":"Prompt oluşturma (s)","gridPos":{"h":7,"w":6,"x":0,"y":24},"fieldConfig":{"defaults":{"unit":"s"}},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"sum(rate(prompt_build_duration_seconds_sum[5m])) / clamp_min(sum(rate(prompt_build_duration_seconds_count[5m])), 1)"}]},
        {"type":"timeseries","title":"LLM round-trip (s)","gridPos":{"h":7,"w":6,"x":6,"y":24},"fieldConfig":{"defaults":{"unit":"s"}},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"histogram_quantile(0.50, sum(rate(llm_request_duration_seconds_bucket[5m])) by (le))","legendFormat":"p50"},{"refId":"B","datasource":{{ $ds }},"expr":"histogram_quantile(0.95, sum(rate(llm_request_duration_seconds_bucket[5m])) by (le))","legendFormat":"p95"}]},
        {"type":"timeseries","title":"Token kullanımı","gridPos":{"h":7,"w":6,"x":12,"y":24},"fieldConfig":{"defaults":{"unit":"short"}},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"sum(rate(llm_tokens_used_total[5m]))"}]},
        {"type":"stat","title":"LLM cache hit rate","gridPos":{"h":7,"w":6,"x":18,"y":24},"fieldConfig":{"defaults":{"unit":"percentunit","min":0,"max":1}},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"sum(rate(biqly_llm_response_cache_hits_total[5m])) / clamp_min(sum(rate(biqly_llm_response_cache_hits_total[5m])) + sum(rate(biqly_llm_response_cache_misses_total[5m])), 1)"}]},
        {"type":"timeseries","title":"Token split: prompt vs completion","gridPos":{"h":7,"w":8,"x":0,"y":31},"fieldConfig":{"defaults":{"unit":"short","custom":{"fillOpacity":30,"stacking":{"group":"A","mode":"normal"}}}},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"sum(rate(biqly_llm_tokens_prompt_total[5m]))","legendFormat":"prompt"},{"refId":"B","datasource":{{ $ds }},"expr":"sum(rate(biqly_llm_tokens_completion_total[5m]))","legendFormat":"completion"}]},
        {"type":"timeseries","title":"LLM retry rate","gridPos":{"h":7,"w":8,"x":8,"y":31},"fieldConfig":{"defaults":{"unit":"short"}},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"sum(rate(biqly_llm_retries_total[5m]))","legendFormat":"retries"}]},
        {"type":"timeseries","title":"LLM errors by provider","gridPos":{"h":7,"w":8,"x":16,"y":31},"fieldConfig":{"defaults":{"unit":"short","custom":{"stacking":{"group":"A","mode":"normal"}}}},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"sum by (provider, error_type) (rate(biqly_llm_errors_total[5m]))","legendFormat":"{{ "{{provider}}" }} - {{ "{{error_type}}" }}"}]},

        {"type":"row","title":"Belirsizlik & onarım","gridPos":{"h":1,"w":24,"x":0,"y":38},"collapsed":false},
        {"type":"timeseries","title":"Clarification oranı","gridPos":{"h":7,"w":8,"x":0,"y":39},"fieldConfig":{"defaults":{"unit":"short"}},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"sum(rate(bi_ai_clarifications_total[5m]))"}]},
        {"type":"timeseries","title":"Ambiguity analiz süresi (ms)","gridPos":{"h":7,"w":8,"x":8,"y":39},"fieldConfig":{"defaults":{"unit":"ms"}},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"histogram_quantile(0.95, sum(rate(biqly_ambiguity_latency_ms_bucket[5m])) by (le))","legendFormat":"p95"}]},
        {"type":"timeseries","title":"Ambiguity kaynağı","gridPos":{"h":7,"w":8,"x":16,"y":39},"fieldConfig":{"defaults":{"unit":"short"}},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"sum by (source) (rate(biqly_ambiguity_by_source[5m]))","legendFormat":"{{ "{{source}}" }}"}]},
        {"type":"timeseries","title":"Retry & repair","gridPos":{"h":7,"w":8,"x":0,"y":46},"fieldConfig":{"defaults":{"unit":"short"}},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"sum(rate(bi_ai_retries_total[5m]))","legendFormat":"retries"},{"refId":"B","datasource":{{ $ds }},"expr":"sum(rate(bi_ai_repair_success_total[5m]))","legendFormat":"repair ok"}]},
        {"type":"timeseries","title":"Repair hata kodları","gridPos":{"h":7,"w":8,"x":8,"y":46},"fieldConfig":{"defaults":{"unit":"short"}},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"topk(8, sum by (code) (rate(bi_ai_repair_by_error_code_total[5m])))","legendFormat":"{{ "{{code}}" }}"}]},
        {"type":"timeseries","title":"Clarification rounds distribution","gridPos":{"h":7,"w":8,"x":16,"y":46},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"sum by (le) (rate(biqly_ambiguity_clarification_rounds_histogram_bucket[5m]))","legendFormat":"Round {{ "{{le}}" }}"}]},

        {"type":"row","title":"Hafıza (few-shot recall)","gridPos":{"h":1,"w":24,"x":0,"y":53},"collapsed":false},
        {"type":"timeseries","title":"Memory store & recall","gridPos":{"h":7,"w":12,"x":0,"y":54},"fieldConfig":{"defaults":{"unit":"short"}},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"sum(rate(biqly_memory_store_confirmed_total[5m]))","legendFormat":"confirmed"},{"refId":"B","datasource":{{ $ds }},"expr":"sum(rate(biqly_memory_store_recall_hits_total[5m]))","legendFormat":"recall hits"},{"refId":"C","datasource":{{ $ds }},"expr":"sum(rate(biqly_memory_recall_misses_total[5m]))","legendFormat":"recall misses"}]},
        {"type":"timeseries","title":"Recall feedback","gridPos":{"h":7,"w":12,"x":12,"y":54},"fieldConfig":{"defaults":{"unit":"percentunit"}},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"sum(rate(biqly_memory_recall_feedback_total{rating=\"positive\"}[5m])) / clamp_min(sum(rate(biqly_memory_recall_feedback_total[5m])), 1)","legendFormat":"thumbs up"},{"refId":"B","datasource":{{ $ds }},"expr":"sum(rate(biqly_memory_recall_feedback_total{recall=\"true\",rating=\"positive\"}[5m])) / clamp_min(sum(rate(biqly_memory_recall_feedback_total{recall=\"true\"}[5m])), 1)","legendFormat":"recall=on"},{"refId":"C","datasource":{{ $ds }},"expr":"sum(rate(biqly_memory_recall_feedback_total{recall=\"false\",rating=\"positive\"}[5m])) / clamp_min(sum(rate(biqly_memory_recall_feedback_total{recall=\"false\"}[5m])), 1)","legendFormat":"recall=off"}]},

        {"type":"row","title":"Yönlendirme & Embedding (Routing & Embedding)","gridPos":{"h":1,"w":24,"x":0,"y":61},"collapsed":false},
        {"type":"timeseries","title":"Routing confidence distribution","gridPos":{"h":7,"w":8,"x":0,"y":62},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"sum by (le) (rate(biqly_routing_confidence_histogram_bucket[5m]))","legendFormat":"{{ "{{le}}" }}"}]},
        {"type":"timeseries","title":"Embedding API latency p95","gridPos":{"h":7,"w":8,"x":8,"y":62},"fieldConfig":{"defaults":{"unit":"s"}},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"histogram_quantile(0.95, sum(rate(biqly_embedding_api_duration_seconds_bucket[5m])) by (le))","legendFormat":"p95"}]},
        {"type":"timeseries","title":"Embedding API error rate","gridPos":{"h":7,"w":8,"x":16,"y":62},"fieldConfig":{"defaults":{"unit":"percentunit"}},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"sum(rate(biqly_embedding_api_errors_total[5m])) / clamp_min(sum(rate(biqly_embedding_api_duration_seconds_count[5m])), 1)","legendFormat":"error rate"}]},

        {"type":"row","title":"Önbellek & LLM tier verimi","gridPos":{"h":1,"w":24,"x":0,"y":69},"collapsed":false},
        {"type":"stat","title":"Embedding cache hit rate","description":"Soru embedding'leri için süreç içi TTL cache (recall yolu). Düşük oran normaldir; çok-turlu clarification oturumları hit üretir.","gridPos":{"h":7,"w":8,"x":0,"y":70},"fieldConfig":{"defaults":{"unit":"percentunit","min":0,"max":1}},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"sum(rate(biqly_embedding_cache_hits_total[5m])) / clamp_min(sum(rate(biqly_embedding_cache_hits_total[5m])) + sum(rate(biqly_embedding_cache_misses_total[5m])), 1)"}]},
        {"type":"timeseries","title":"Ambiguity LLM tier yield","description":"LLM tier'ının gerçek katkısı: 'found' oranı kalıcı olarak sıfıra yakınsa tier-1 boşken LLM çağrısı atlanabilir (tasks/01 §4 kararı).","gridPos":{"h":7,"w":8,"x":8,"y":70},"fieldConfig":{"defaults":{"unit":"short"}},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"sum by (outcome) (rate(biqly_ambiguity_llm_tier_yield_total[5m]))","legendFormat":"{{ "{{outcome}}" }}"}]},
        {"type":"timeseries","title":"Clarification sonucu (resolved / abandoned)","gridPos":{"h":7,"w":8,"x":16,"y":70},"fieldConfig":{"defaults":{"unit":"short"}},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"sum by (outcome) (rate(biqly_ambiguity_resolution_total[5m]))","legendFormat":"{{ "{{outcome}}" }}"}]}
      ]
    }
  biqly-query.json: |
    {
      "title": "Biqly Query",
      "uid": "biqly-query",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": {"from": "now-6h", "to": "now"},
      "tags": ["biqly", "query"],
      "panels": [
        {"type":"row","title":"Derleme","gridPos":{"h":1,"w":24,"x":0,"y":0},"collapsed":false},
        {"type":"stat","title":"Derleme / dk","gridPos":{"h":4,"w":6,"x":0,"y":1},"fieldConfig":{"defaults":{"unit":"short"}},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"sum(rate(query_compile_total[5m])) * 60"}]},
        {"type":"stat","title":"Derleme hata %","gridPos":{"h":4,"w":6,"x":6,"y":1},"fieldConfig":{"defaults":{"unit":"percentunit","min":0,"max":1}},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"sum(rate(query_compile_errors_total[5m])) / clamp_min(sum(rate(query_compile_total[5m])), 1)"}]},
        {"type":"stat","title":"p95 derleme (s)","gridPos":{"h":4,"w":6,"x":12,"y":1},"fieldConfig":{"defaults":{"unit":"s"}},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"histogram_quantile(0.95, sum(rate(query_compile_duration_seconds_bucket[5m])) by (le))"}]},
        {"type":"stat","title":"Satır / s","gridPos":{"h":4,"w":6,"x":18,"y":1},"fieldConfig":{"defaults":{"unit":"short"}},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"sum(rate(query_rows_returned_total[5m]))"}]},
        {"type":"timeseries","title":"Derleme süresi","gridPos":{"h":8,"w":12,"x":0,"y":5},"fieldConfig":{"defaults":{"unit":"s"}},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"histogram_quantile(0.50, sum(rate(query_compile_duration_seconds_bucket[5m])) by (le))","legendFormat":"p50"},{"refId":"B","datasource":{{ $ds }},"expr":"histogram_quantile(0.95, sum(rate(query_compile_duration_seconds_bucket[5m])) by (le))","legendFormat":"p95"}]},
        {"type":"timeseries","title":"Derleme hacmi","gridPos":{"h":8,"w":12,"x":12,"y":5},"fieldConfig":{"defaults":{"unit":"short"}},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"sum(rate(query_compile_total[5m]))","legendFormat":"compile"},{"refId":"B","datasource":{{ $ds }},"expr":"sum(rate(query_compile_errors_total[5m]))","legendFormat":"errors"}]},

        {"type":"row","title":"Çalıştırma","gridPos":{"h":1,"w":24,"x":0,"y":13},"collapsed":false},
        {"type":"stat","title":"Çalıştırma / dk","gridPos":{"h":4,"w":6,"x":0,"y":14},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"sum(rate(query_execute_total[5m])) * 60"}]},
        {"type":"stat","title":"Çalıştırma hata %","gridPos":{"h":4,"w":6,"x":6,"y":14},"fieldConfig":{"defaults":{"unit":"percentunit"}},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"sum(rate(query_execute_errors_total[5m])) / clamp_min(sum(rate(query_execute_total[5m])), 1)"}]},
        {"type":"stat","title":"p95 çalıştırma (s)","gridPos":{"h":4,"w":6,"x":12,"y":14},"fieldConfig":{"defaults":{"unit":"s"}},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"histogram_quantile(0.95, sum(rate(query_execute_duration_seconds_bucket[5m])) by (le))"}]},
        {"type":"stat","title":"Ort. satır","gridPos":{"h":4,"w":6,"x":18,"y":14},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"sum(rate(query_rows_returned_total[5m])) / clamp_min(sum(rate(query_execute_total[5m])), 1)"}]},
        {"type":"timeseries","title":"Çalıştırma süresi","gridPos":{"h":8,"w":12,"x":0,"y":18},"fieldConfig":{"defaults":{"unit":"s"}},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"histogram_quantile(0.50, sum(rate(query_execute_duration_seconds_bucket[5m])) by (le))","legendFormat":"p50"},{"refId":"B","datasource":{{ $ds }},"expr":"histogram_quantile(0.95, sum(rate(query_execute_duration_seconds_bucket[5m])) by (le))","legendFormat":"p95"}]},
        {"type":"timeseries","title":"Dönen satırlar","gridPos":{"h":8,"w":12,"x":12,"y":18},"fieldConfig":{"defaults":{"unit":"short"}},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"sum(rate(query_rows_returned_total[5m]))"}]}
      ]
    }
  biqly-catalog.json: |
    {
      "title": "Biqly Catalog",
      "uid": "biqly-catalog",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": {"from": "now-6h", "to": "now"},
      "tags": ["biqly", "catalog"],
      "panels": [
        {"type":"row","title":"Metadata DB","gridPos":{"h":1,"w":24,"x":0,"y":0},"collapsed":false},
        {"type":"stat","title":"DB sorgu / dk","gridPos":{"h":4,"w":6,"x":0,"y":1},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"sum(rate(catalog_db_queries_total[5m])) * 60"}]},
        {"type":"stat","title":"DB hata %","gridPos":{"h":4,"w":6,"x":6,"y":1},"fieldConfig":{"defaults":{"unit":"percentunit"}},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"sum(rate(catalog_db_query_errors_total[5m])) / clamp_min(sum(rate(catalog_db_queries_total[5m])), 1)"}]},
        {"type":"stat","title":"p95 DB (s)","gridPos":{"h":4,"w":6,"x":12,"y":1},"fieldConfig":{"defaults":{"unit":"s"}},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"histogram_quantile(0.95, sum(rate(catalog_db_query_duration_seconds_bucket[5m])) by (le))"}]},
        {"type":"stat","title":"Ort. DB (s)","gridPos":{"h":4,"w":6,"x":18,"y":1},"fieldConfig":{"defaults":{"unit":"s"}},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"sum(rate(catalog_db_query_duration_seconds_sum[5m])) / clamp_min(sum(rate(catalog_db_query_duration_seconds_count[5m])), 1)"}]},
        {"type":"timeseries","title":"DB sorgu hacmi","gridPos":{"h":8,"w":12,"x":0,"y":5},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"sum(rate(catalog_db_queries_total[5m]))","legendFormat":"queries"},{"refId":"B","datasource":{{ $ds }},"expr":"sum(rate(catalog_db_query_errors_total[5m]))","legendFormat":"errors"}]},
        {"type":"timeseries","title":"DB süre","gridPos":{"h":8,"w":12,"x":12,"y":5},"fieldConfig":{"defaults":{"unit":"s"}},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"histogram_quantile(0.95, sum(rate(catalog_db_query_duration_seconds_bucket[5m])) by (le))","legendFormat":"p95"}]},

        {"type":"row","title":"Semantic model publish","gridPos":{"h":1,"w":24,"x":0,"y":13},"collapsed":false},
        {"type":"stat","title":"Publish / dk","gridPos":{"h":4,"w":8,"x":0,"y":14},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"sum(rate(model_publish_total[5m])) * 60"}]},
        {"type":"stat","title":"Publish hata %","gridPos":{"h":4,"w":8,"x":8,"y":14},"fieldConfig":{"defaults":{"unit":"percentunit"}},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"sum(rate(model_publish_errors_total[5m])) / clamp_min(sum(rate(model_publish_total[5m])), 1)"}]},
        {"type":"stat","title":"p95 publish (s)","gridPos":{"h":4,"w":8,"x":16,"y":14},"fieldConfig":{"defaults":{"unit":"s"}},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"histogram_quantile(0.95, sum(rate(model_publish_duration_seconds_bucket[5m])) by (le))"}]},
        {"type":"timeseries","title":"Publish süresi","gridPos":{"h":8,"w":24,"x":0,"y":18},"fieldConfig":{"defaults":{"unit":"s"}},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"sum(rate(model_publish_duration_seconds_sum[5m])) / clamp_min(sum(rate(model_publish_duration_seconds_count[5m])), 1)","legendFormat":"avg"},{"refId":"B","datasource":{{ $ds }},"expr":"histogram_quantile(0.95, sum(rate(model_publish_duration_seconds_bucket[5m])) by (le))","legendFormat":"p95"}]}
      ]
    }
  biqly-cardinality.json: |
    {
      "title": "Biqly Metric Cardinality",
      "uid": "biqly-cardinality",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": {"from": "now-6h", "to": "now"},
      "tags": ["biqly", "observability"],
      "panels": [
        {"type":"row","title":"Prometheus cardinality","gridPos":{"h":1,"w":24,"x":0,"y":0},"collapsed":false},
        {"type":"stat","title":"Yüksek seri sayılı metrikler","gridPos":{"h":4,"w":8,"x":0,"y":1},"fieldConfig":{"defaults":{"unit":"short","thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"yellow","value":1},{"color":"red","value":5}]}}},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"count(bi_prom_metric_series_total > 100)"}]},
        {"type":"stat","title":"Yüksek label cardinality","gridPos":{"h":4,"w":8,"x":8,"y":1},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"count(bi_prom_label_cardinality > 16)"}]},
        {"type":"stat","title":"Toplam metrik ailesi","gridPos":{"h":4,"w":8,"x":16,"y":1},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"count(bi_prom_metric_series_total)"}]},
        {"type":"timeseries","title":"En çok seri üreten metrikler","gridPos":{"h":10,"w":12,"x":0,"y":5},"fieldConfig":{"defaults":{"unit":"short"}},"options":{"legend":{"displayMode":"table","placement":"right","calcs":["last"]}},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"topk(15, bi_prom_metric_series_total)","legendFormat":"{{ "{{metric}}" }}"}]},
        {"type":"timeseries","title":"Label cardinality","gridPos":{"h":10,"w":12,"x":12,"y":5},"options":{"legend":{"displayMode":"table","placement":"right","calcs":["last"]}},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"topk(20, bi_prom_label_cardinality)","legendFormat":"{{ "{{metric}}" }}/{{ "{{label}}" }}"}]},
        {"type":"table","title":"Label cardinality > 16","gridPos":{"h":10,"w":24,"x":0,"y":15},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"bi_prom_label_cardinality > 16","format":"table","instant":true}]}
      ]
    }
  biqly-infrastructure.json: |
    {
      "title": "Biqly Infrastructure",
      "uid": "biqly-infrastructure",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": {"from": "now-6h", "to": "now"},
      "tags": ["biqly", "infrastructure"],
      "panels": [
        {"type":"row","title":"HTTP Requests","gridPos":{"h":1,"w":24,"x":0,"y":0},"collapsed":false},
        {"type":"timeseries","title":"HTTP request rate by route group","gridPos":{"h":8,"w":12,"x":0,"y":1},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"sum by (route_group) (rate(biqly_http_requests_total[5m]))","legendFormat":"{{ "{{route_group}}" }}"}]},
