        {"type":"timeseries","title":"NATS DLQ moves","gridPos":{"h":8,"w":8,"x":8,"y":19},"targets":[{"refId":"A","datasource":{{ $ds }},"expr":"sum(rate(biqly_nats_dlq_moves_total[5m]))","legendFormat":"DLQ moves"}]},
