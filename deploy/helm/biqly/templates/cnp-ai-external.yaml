{{- if and .Values.global.networkPolicy.enabled .Values.global.networkPolicy.aiExternal.enabled }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: biqly-ai-egress-external
  labels:
    {{- include "biqly.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/part-of: biqly
    matchExpressions:
      # The worker executes AI jobs (LLM calls), so it needs the same external
      # egress (world HTTPS, Ollama CIDRs, auth service) as the AI service.
      - key: app.kubernetes.io/component
        operator: In
        values:
          - ai
          - worker
  egress:
    {{- $aiExt := .Values.global.networkPolicy.aiExternal }}
    {{- if $aiExt.allowWorldHTTPS }}
    - toEntities:
        - world
      toPorts:
        - ports:
            {{- range $aiExt.worldPorts }}
            - port: {{ . | quote }}
              protocol: TCP
            {{- end }}
    {{- end }}
    {{- if or $aiExt.fqdnNames $aiExt.fqdnMatchPatterns }}
    - toFQDNs:
        {{- range $aiExt.fqdnNames }}
        - matchName: {{ . | quote }}
        {{- end }}
        {{- range $aiExt.fqdnMatchPatterns }}
        - matchPattern: {{ . | quote }}
        {{- end }}
      toPorts:
        - ports:
            {{- range $aiExt.fqdnPorts }}
            - port: {{ . | quote }}
              protocol: TCP
            {{- end }}
    {{- end }}
    {{- with .Values.global.networkPolicy.aiExternal.cidrs }}
    - toCIDRSet:
        {{- range . }}
        - cidr: {{ . | quote }}
        {{- end }}
      toPorts:
        - ports:
            {{- range $.Values.global.networkPolicy.aiExternal.cidrPorts }}
            - port: {{ . | quote }}
              protocol: TCP
            {{- end }}
    {{- end }}
    {{- if and $aiExt.authService $aiExt.authService.enabled }}
    # In-cluster egress to the auth service: the AI service fetches the JWT
    # public key (optional identity) and calls /internal/auth/* for per-user
    # AI model access and preferences.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/component: auth
            app.kubernetes.io/part-of: biqly
      toPorts:
        - ports:
            - port: {{ $aiExt.authService.port | quote }}
              protocol: TCP
    {{- end }}
    {{- if and $aiExt.gateway $aiExt.gateway.enabled }}
    # In-cluster egress to the Envoy gateway: the web agent's tool dispatches
    # (list_skills, run_question, ...) proxy to BI_API_SERVICE_URL, which
    # points at the gateway service so calls stay inside the cluster instead
    # of round-tripping through Cloudflare (whose hiccups surfaced as 502s).
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: envoy
            gateway.envoyproxy.io/owning-gateway-name: {{ $aiExt.gateway.name | quote }}
            k8s:io.kubernetes.pod.namespace: {{ $aiExt.gateway.namespace | quote }}
      toPorts:
        - ports:
            {{- range $aiExt.gateway.ports }}
            - port: {{ . | quote }}
              protocol: TCP
            {{- end }}
    {{- end }}
{{- end }}
