{{- if .Values.global.observability.prometheusRules.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: biqly-alerts
  labels:
    {{- include "biqly.labels" . | nindent 4 }}
    {{- toYaml .Values.global.observability.prometheusRules.labels | nindent 4 }}
spec:
  groups:
    - name: biqly.ai
      rules:
        - alert: BiqlyAILLMLatencyHigh
          expr: |
            histogram_quantile(0.95, sum(rate(llm_request_duration_seconds_bucket[5m])) by (le)) > 30
          for: 5m
          labels:
            severity: warning
            service: ai
          annotations:
            summary: "Biqly AI p95 LLM round-trip latency is above 30s"
            description: "LLM provider round-trip (llm_request_duration_seconds) p95 exceeded 30 seconds for 5 minutes."
        - alert: BiqlyAIErrorBudgetBurn
          expr: |
            sum(rate(bi_ai_errors_total[5m]))
            /
            clamp_min(sum(rate(bi_ai_requests_total[5m])), 1) > 0.05
          for: 5m
          labels:
            severity: critical
            service: ai
          annotations:
            summary: "Biqly AI error rate is burning the 95% success SLO"
        - alert: BiqlyEmbeddingAPIErrors
          expr: |
            sum(rate(biqly_embedding_api_errors_total[5m]))
            /
            clamp_min(sum(rate(biqly_embedding_api_duration_seconds_count[5m])), 1) > 0.05
          for: 5m
          labels:
            severity: warning
            service: ai
          annotations:
            summary: "Biqly Embedding API error rate is high (> 5%)"
            description: "Embedding API error rate exceeded 5% for 5 minutes."
        - alert: BiqlyRoutingConfidenceLow
          expr: |
            histogram_quantile(0.50, sum(rate(biqly_routing_confidence_histogram_bucket[15m])) by (le)) < 0.5
          for: 15m
          labels:
            severity: warning
            service: ai
          annotations:
            summary: "Biqly Routing p50 confidence is low (< 0.5)"
            description: "p50 routing confidence is below 0.5 for the last 15 minutes."
    - name: biqly.query
      rules:
        - alert: BiqlyQueryCompileLatencyHigh
          expr: |
            sum(rate(query_compile_duration_seconds[10m]))
            /
            clamp_min(sum(rate(query_compile_total[10m])), 1) > 0.1
          for: 10m
          labels:
            severity: warning
            service: query
          annotations:
            summary: "Biqly Query average compile latency is above 100ms"
        - alert: BiqlyQueryErrorBudgetBurn
          expr: |
            sum(rate(query_compile_errors_total[5m]) + rate(query_execute_errors_total[5m]))
            /
            clamp_min(sum(rate(query_compile_total[5m]) + rate(query_execute_total[5m])), 1) > 0.05
          for: 5m
          labels:
            severity: critical
            service: query
          annotations:
            summary: "Biqly Query error rate is burning the 95% success SLO"
    - name: biqly.catalog
      rules:
        - alert: BiqlyCatalogDBLatencyHigh
          expr: |
            sum(rate(catalog_db_query_duration_seconds[10m]))
            /
            clamp_min(sum(rate(catalog_db_queries_total[10m])), 1) > 0.2
          for: 10m
          labels:
            severity: warning
            service: catalog
          annotations:
            summary: "Biqly Catalog average DB latency is above 200ms"
        - alert: BiqlyCatalogErrorBudgetBurn
          expr: |
            sum(rate(catalog_db_query_errors_total[5m]) + rate(model_publish_errors_total[5m]))
            /
            clamp_min(sum(rate(catalog_db_queries_total[5m]) + rate(model_publish_total[5m])), 1) > 0.05
          for: 5m
          labels:
            severity: critical
            service: catalog
          annotations:
            summary: "Biqly Catalog error rate is burning the 95% success SLO"
    - name: biqly.infrastructure
      rules:
        - alert: BiqlyHTTP5xxRateHigh
          expr: |
            sum(rate(biqly_http_requests_total{status_class="5xx"}[5m]))
            /
            clamp_min(sum(rate(biqly_http_requests_total[5m])), 1) > 0.01
          for: 5m
          labels:
            severity: critical
            service: gateway
          annotations:
            summary: "Biqly HTTP 5xx error rate is high (> 1%)"
            description: "HTTP 5xx rate exceeded 1% for 5 minutes."
        - alert: BiqlyDBPoolExhaustion
          expr: |
            biqly_db_pool_in_use
            /
            clamp_min(biqly_db_pool_open_connections, 1) > 0.90
          for: 3m
          labels:
            severity: warning
            service: db
          annotations:
            summary: "Biqly DB connection pool is near exhaustion (> 90%)"
            description: "Database connection pool in-use count is more than 90% of open connections for 3 minutes."
        - alert: BiqlyNATSDLQMoves
          expr: |
            sum(rate(biqly_nats_dlq_moves_total[5m])) > 0
          for: 5m
          labels:
            severity: warning
            service: queue
          annotations:
            summary: "Biqly NATS messages are moving to DLQ"
            description: "NATS dead letter queue moves have occurred in the last 5 minutes."
        - alert: BiqlyNATSConsumerPending
          expr: |
            biqly_nats_consumer_pending > 0
          for: 5m
          labels:
            severity: warning
            service: queue
          annotations:
            summary: "Biqly NATS consumer has pending messages"
            description: "NATS AI job consumer pending count has stayed above zero for more than 5 minutes."
        - alert: BiqlyServiceDown
          expr: |
            up{job=~"biqly-.*"} == 0
          for: 2m
          labels:
            severity: critical
            service: platform
          annotations:
            summary: "Biqly service {{`{{ $labels.job }}`}} is down"
            description: "Prometheus cannot scrape {{`{{ $labels.job }}`}} ({{`{{ $labels.instance }}`}}) — the target has been down for 2 minutes. Rate-based alerts go blind while a target is down, so this is the backstop."
    - name: biqly.security
      rules:
        - alert: BiqlyAuthFailedLoginSpike
          expr: |
            sum(rate(auth_failed_login_total[5m])) > 1
          for: 10m
          labels:
            severity: warning
            service: auth
          annotations:
            summary: "Biqly failed-login rate is elevated (possible brute force / credential stuffing)"
            description: "auth_failed_login_total is averaging more than 1/s over 5m for 10 minutes. Check the reason breakdown (bad_password vs user_not_found) for the attack shape."
        - alert: BiqlyAISpendLimitRejections
          expr: |
            sum(rate(biqly_ai_spend_limit_rejections_total[15m])) > 0
          for: 15m
          labels:
            severity: warning
            service: ai
          annotations:
            summary: "Biqly workspaces are hitting the daily AI token budget"
            description: "AI requests are being rejected by the per-workspace spend limiter. Either a workspace budget (BI_AI_WORKSPACE_DAILY_TOKEN_BUDGET) is set too low, or a workspace is consuming abnormally — investigate before raising the cap."
{{- end }}
