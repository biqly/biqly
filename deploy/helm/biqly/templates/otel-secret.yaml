{{- $tracing := .Values.global.observability.tracing -}}
{{- if and $tracing.enabled $tracing.otelSecret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.secretNames.otel | default "biqly-otel-secrets" }}
  labels:
    {{- include "biqly.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ $tracing.otlpHeadersSecret.key | default "OTEL_EXPORTER_OTLP_HEADERS" }}: {{ required "global.observability.tracing.otelSecret.OTEL_EXPORTER_OTLP_HEADERS is required when otelSecret.create is true" $tracing.otelSecret.OTEL_EXPORTER_OTLP_HEADERS | quote }}
{{- end }}
