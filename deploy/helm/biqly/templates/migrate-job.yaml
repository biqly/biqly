{{- if .Values.global.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "biqly.fullname" . }}-migrate
  labels:
    {{- include "biqly.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-10"
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "-10"
spec:
  backoffLimit: {{ .Values.global.migrate.backoffLimit }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "biqly.name" . }}-migrate
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migrate
        app.kubernetes.io/part-of: biqly
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "biqly.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- if or .Values.global.imagePullSecrets .Values.global.registrySecret.create }}
      imagePullSecrets:
        {{- with .Values.global.imagePullSecrets }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.global.registrySecret.create }}
        - name: {{ .Values.global.registrySecret.name }}
        {{- end }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          {{- $registry := trimSuffix "/" .Values.global.biqlyImageRegistry }}
          {{- $repo := .Values.global.migrate.image.repository }}
          {{/*
            Lockstep with the catalog image: when catalog is pinned to a
            sha-<commit> tag (argocd-image-updater), run migrations from the
            migrate image built at the SAME commit. The migrate image builds
            on every main push, so the matching tag always exists. This
            prevents app pods rolling out new code before their migrations:
            the image-updater cannot track the migrate image directly because
            the PreSync hook Job is deleted on success and never appears in
            the Application's live image list.
          */}}
          {{- $migrateTag := .Values.global.migrate.image.tag }}
          {{- $catalogTag := dig "image" "tag" "" (.Values.catalog | default dict) }}
          {{- if hasPrefix "sha-" $catalogTag }}
          {{- $migrateTag = $catalogTag }}
          {{- end }}
          {{- if or (contains "/" $repo) (not $registry) }}
          image: {{ printf "%s:%s" $repo $migrateTag | quote }}
          {{- else }}
          image: {{ printf "%s/%s:%s" $registry $repo $migrateTag | quote }}
          {{- end }}
          imagePullPolicy: {{ .Values.global.migrate.image.pullPolicy }}
          args:
            - -dir
            - /migrations
            - up
          envFrom:
            - secretRef:
                name: {{ .Values.global.secretNames.db }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            {{- toYaml .Values.global.migrate.resources | nindent 12 }}
{{- end }}
