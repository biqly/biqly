{{- if .Values.global.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "biqly.fullname" . }}-migrate
  labels:
    {{- include "biqly.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "-10"
spec:
  backoffLimit: {{ .Values.global.migrate.backoffLimit }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "biqly.name" . }}-migrate
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migrate
        app.kubernetes.io/part-of: biqly
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "biqly.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- if or .Values.global.imagePullSecrets .Values.global.registrySecret.create }}
      imagePullSecrets:
        {{- with .Values.global.imagePullSecrets }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.global.registrySecret.create }}
        - name: {{ .Values.global.registrySecret.name }}
        {{- end }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: {{ printf "%s/%s:%s" (trimSuffix "/" .Values.global.biqlyImageRegistry) .Values.global.migrate.image.repository .Values.global.migrate.image.tag | quote }}
          imagePullPolicy: {{ .Values.global.migrate.image.pullPolicy }}
          args:
            - -dir
            - /migrations
            - up
          envFrom:
            - secretRef:
                name: {{ .Values.global.secretNames.db }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
{{- end }}
