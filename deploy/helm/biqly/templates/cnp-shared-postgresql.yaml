{{- $shared := .Values.global.networkPolicy.sharedPostgresql -}}
{{- if and .Values.global.networkPolicy.enabled $shared.enabled }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: biqly-shared-postgresql-egress
  labels:
    {{- include "biqly.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/part-of: biqly
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          {{- range $shared.components }}
          - {{ . }}
          {{- end }}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/component: primary
            app.kubernetes.io/instance: {{ $shared.instanceName }}
            app.kubernetes.io/name: postgresql
            k8s:io.kubernetes.pod.namespace: {{ $shared.namespace }}
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # These components (e.g. worker) are only selected by this policy and by no
    # other egress-granting CiliumNetworkPolicy, so without these two rules
    # Cilium's default-deny leaves them unable to reach NATS/the OTel collector
    # even though other components (ai/query/catalog) get the same access via
    # their own broader policies (biqly-allow-gateway, biqly-egress-metadata).
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/component: messaging
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/part-of: biqly
      toPorts:
        - ports:
            - port: "4222"
              protocol: TCP
    {{- if .Values.global.observability.tracing.useInClusterCollector }}
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: biqly-otel-infra-collector
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/part-of: biqly
      toPorts:
        - ports:
            - port: "4318"
              protocol: TCP
    {{- end }}
{{- end }}
