{{- if and .Values.global.networkPolicy.enabled .Values.global.networkPolicy.metadata.enabled }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: biqly-egress-metadata
  labels:
    {{- include "biqly.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - ai
          - query
          - catalog
          - worker
          # Agent uses only postgres+otel from this bundle (no redis, no auth
          # client — see internal/app/agent_dependencies.go). It gets the same
          # bundle as the others anyway: splitting postgres+otel out of this
          # policy for one component isn't worth the added policy surface in
          # the embedded-Postgres (dev) topology. In prod's shared-Postgres
          # topology, agent's grant is properly least-privilege instead — see
          # global.networkPolicy.sharedPostgresql.components (no redis/auth
          # there at all).
          - agent
  egress:
    - toEntities:
        - cluster
      toPorts:
        - ports:
            - port: {{ .Values.global.networkPolicy.metadata.ports.postgres | quote }}
              protocol: TCP
            - port: {{ .Values.global.networkPolicy.metadata.ports.redis | quote }}
              protocol: TCP
            {{- if .Values.global.observability.tracing.useInClusterCollector }}
            # OTLP export to the in-cluster collector gateway (gRPC + HTTP).
            - port: "4317"
              protocol: TCP
            - port: "4318"
              protocol: TCP
            {{- end }}
    # JWT public-key fetches and permission checks against the auth service.
    # Without this, BI_AUTH_ENABLED=true leaves catalog/query unable to verify
    # tokens (every /api request answers 503 "auth key unavailable").
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/component: auth
            app.kubernetes.io/part-of: biqly
      toPorts:
        - ports:
            - port: "8889"
              protocol: TCP
{{- end }}
