{{- if and .Values.global.networkPolicy.enabled .Values.global.networkPolicy.metadata.enabled }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: biqly-egress-metadata
  labels:
    {{- include "biqly.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - ai
          - query
          - catalog
          - worker
  egress:
    - toEntities:
        - cluster
      toPorts:
        - ports:
            - port: {{ .Values.global.networkPolicy.metadata.ports.postgres | quote }}
              protocol: TCP
            - port: {{ .Values.global.networkPolicy.metadata.ports.redis | quote }}
              protocol: TCP
            {{- if .Values.global.observability.tracing.useInClusterCollector }}
            # OTLP export to the in-cluster collector gateway (gRPC + HTTP).
            - port: "4317"
              protocol: TCP
            - port: "4318"
              protocol: TCP
            {{- end }}
    # JWT public-key fetches and permission checks against the auth service.
    # Without this, BI_AUTH_ENABLED=true leaves catalog/query unable to verify
    # tokens (every /api request answers 503 "auth key unavailable").
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/component: auth
            app.kubernetes.io/part-of: biqly
      toPorts:
        - ports:
            - port: "8889"
              protocol: TCP
{{- end }}
