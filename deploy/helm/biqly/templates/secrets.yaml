{{- if .Values.global.secrets.createSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.secretNames.db }}
  labels:
    {{- include "biqly.labels" . | nindent 4 }}
type: Opaque
stringData:
  BI_METADATA_DB_DSN: {{ required "global.secrets.BI_METADATA_DB_DSN is required" .Values.global.secrets.BI_METADATA_DB_DSN | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.secretNames.security }}
  labels:
    {{- include "biqly.labels" . | nindent 4 }}
type: Opaque
stringData:
  BI_ENCRYPTION_KEY: {{ required "global.secrets.BI_ENCRYPTION_KEY is required" .Values.global.secrets.BI_ENCRYPTION_KEY | quote }}
  {{- with .Values.global.secrets.BI_INTERNAL_API_TOKEN }}
  BI_INTERNAL_API_TOKEN: {{ . | quote }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.secretNames.ai }}
  labels:
    {{- include "biqly.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.global.secrets.BI_AI_API_KEY }}
  BI_AI_API_KEY: {{ . | quote }}
  {{- else }}
  BI_AI_API_KEY: ""
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.secretNames.embedding }}
  labels:
    {{- include "biqly.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.global.secrets.BI_AI_EMBEDDING_API_KEY }}
  BI_AI_EMBEDDING_API_KEY: {{ . | quote }}
  {{- else }}
  BI_AI_EMBEDDING_API_KEY: ""
  {{- end }}
{{- end }}
