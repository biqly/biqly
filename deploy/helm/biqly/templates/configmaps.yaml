apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.global.secretNames.config }}
  labels:
    {{- include "biqly.labels" . | nindent 4 }}
  annotations:
    # Latest migration revision shipped with the chart. The migrate Job is a
    # Helm pre-upgrade hook, so it is not part of the rendered manifest Flux
    # tracks; a commit that only changes migrations/hook resources may not
    # produce a release diff. Bumping this annotation changes the ConfigMap and
    # forces a Helm upgrade (and thus the migrate hook) to run.
    migrations.biqly.io/revision: "039"
data:
  {{- range $key, $value := .Values.global.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- if .Values.global.observability.tracing.enabled }}
  {{- $tracing := .Values.global.observability.tracing }}
  OTEL_SERVICE_NAME: {{ $tracing.serviceName | default "biqly" | quote }}
  {{- if $tracing.useInClusterCollector }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ $tracing.collectorEndpoint | required "tracing.collectorEndpoint is required when useInClusterCollector is true" | quote }}
  {{- else }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ $tracing.otlpEndpoint | required "global.observability.tracing.otlpEndpoint is required when tracing.enabled" | quote }}
  {{- end }}
  OTEL_TRACES_SAMPLER: {{ $tracing.sampler | default "parentbased_traceidratio" | quote }}
  OTEL_TRACES_SAMPLER_ARG: {{ $tracing.samplerArg | default "0.25" | quote }}
  {{- end }}
{{/*
  The former "{{ .Values.global.secretNames.aiConfig }}-provider" ConfigMap held
  BI_AI_PROVIDER/MODEL/TEMPERATURE/EMBEDDING_MODEL. Provider/model selection now
  lives in the ai_providers / ai_models tables, so that ConfigMap was removed.
*/}}
