apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.global.secretNames.config }}
  labels:
    {{- include "biqly.labels" . | nindent 4 }}
  annotations:
    # Latest migration revision shipped with the chart. PreSync hook Jobs do
    # not participate in ArgoCD diffing, so a commit that only changes
    # migrations/hook resources never triggers an automated sync. Bumping
    # this annotation creates a real diff and forces the sync (and thus the
    # migrate hook) to run.
    migrations.biqly.io/revision: "039"
data:
  {{- range $key, $value := .Values.global.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- if .Values.global.observability.tracing.enabled }}
  OTEL_SERVICE_NAME: {{ .Values.global.observability.tracing.serviceName | default "biqly" | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.global.observability.tracing.otlpEndpoint | default "http://biqly-otel-collector:4318" | quote }}
  OTEL_TRACES_SAMPLER: {{ .Values.global.observability.tracing.sampler | default "parentbased_traceidratio" | quote }}
  OTEL_TRACES_SAMPLER_ARG: {{ .Values.global.observability.tracing.samplerArg | default "0.25" | quote }}
  {{- end }}
{{/*
  The former "{{ .Values.global.secretNames.aiConfig }}-provider" ConfigMap held
  BI_AI_PROVIDER/MODEL/TEMPERATURE/EMBEDDING_MODEL. Provider/model selection now
  lives in the ai_providers / ai_models tables, so that ConfigMap was removed.
*/}}
