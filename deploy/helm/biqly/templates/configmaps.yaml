apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.global.secretNames.config }}
  labels:
    {{- include "biqly.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.global.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{/*
  The former "{{ .Values.global.secretNames.aiConfig }}-provider" ConfigMap held
  BI_AI_PROVIDER/MODEL/TEMPERATURE/EMBEDDING_MODEL. Provider/model selection now
  lives in the ai_providers / ai_models tables, so that ConfigMap was removed.
*/}}
