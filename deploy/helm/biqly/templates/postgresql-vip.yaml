{{- if .Values.global.postgresqlVIP.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.global.postgresqlVIP.name }}
  labels:
    {{- include "biqly.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.global.postgresqlVIP.annotations | nindent 4 }}
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: postgres
      port: {{ .Values.global.postgresqlVIP.port }}
      targetPort: tcp-postgresql
      protocol: TCP
{{- end }}
