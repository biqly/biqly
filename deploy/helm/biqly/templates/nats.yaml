{{- if .Values.global.nats.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: biqly-nats
  labels:
    {{- include "biqly.labels" . | nindent 4 }}
    app.kubernetes.io/component: messaging
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: biqly-nats
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: messaging
  template:
    metadata:
      labels:
        app.kubernetes.io/name: biqly-nats
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: messaging
        app.kubernetes.io/part-of: biqly
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nats
          image: {{ .Values.global.nats.image | quote }}
          args: ["-js", "-m", "8222"]
          ports:
            - name: client
              containerPort: {{ .Values.global.nats.service.clientPort }}
            - name: monitor
              containerPort: {{ .Values.global.nats.service.monitorPort }}
          resources:
            {{- toYaml .Values.global.nats.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: biqly-nats
  labels:
    {{- include "biqly.labels" . | nindent 4 }}
    app.kubernetes.io/component: messaging
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: biqly-nats
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: client
      port: {{ .Values.global.nats.service.clientPort }}
      targetPort: client
    - name: monitor
      port: {{ .Values.global.nats.service.monitorPort }}
      targetPort: monitor
{{- end }}
