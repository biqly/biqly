{{- if .Values.global.backup.enabled }}
{{- if not .Values.global.backup.s3.bucket }}
{{- fail "global.backup.s3.bucket is required when backup.enabled=true" }}
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "biqly.fullname" . }}-postgres-backup
  labels:
    {{- include "biqly.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.global.backup.schedule | quote }}
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          containers:
            - name: pg-dump
              image: {{ .Values.global.backup.image | quote }}
              command:
                - sh
                - -c
                - |
                  set -eu
                  pg_dump "$BI_METADATA_DB_DSN" > /tmp/bi_metadata.sql
                  echo "Backup written to /tmp/bi_metadata.sql; upload integration is environment-specific"
              envFrom:
                - secretRef:
                    name: {{ .Values.global.secretNames.db }}
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
{{- end }}
