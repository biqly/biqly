{{- if and .Values.global.networkPolicy.enabled .Values.global.networkPolicy.gateway.enabled }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: biqly-allow-gateway
  labels:
    {{- include "biqly.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - ai
          - query
          - catalog
          # The worker runs the AI job consumer, so it needs the same in-cluster
          # egress (catalog/query/ai/NATS) as the HTTP services.
          - worker
          # The agentic query runner needs the same in-cluster egress
          # (catalog/query/ai/NATS) as the worker — see internal/app/agent_dependencies.go.
          - agent
  ingress:
    - fromEntities:
        - ingress
        - host
        - remote-node
        - health
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "8081"
              protocol: TCP
            - port: "8082"
              protocol: TCP
            # Worker metrics endpoint (host-network Prometheus scrapes).
            - port: "8083"
              protocol: TCP
            # Agent healthz/readyz/metrics endpoint (host-network Prometheus
            # scrapes; see deploy/helm/biqly/charts/agent).
            - port: "8084"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/part-of: biqly
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "8081"
              protocol: TCP
            - port: "8082"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/part-of: biqly
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "8081"
              protocol: TCP
            - port: "8082"
              protocol: TCP
            - port: {{ .Values.global.nats.service.clientPort | quote }}
              protocol: TCP
{{- end }}
