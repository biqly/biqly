{{- if and .Values.global.gateway.enabled .Values.global.gateway.redirect.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "biqly.fullname" . }}-redirect
  labels:
    {{- include "biqly.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.global.gateway.httpParentRef.name }}
      namespace: {{ .Values.global.gateway.httpParentRef.namespace }}
      {{- with .Values.global.gateway.httpParentRef.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  hostnames:
    {{- toYaml .Values.global.gateway.hostnames | nindent 4 }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: {{ .Values.global.gateway.redirect.scheme | quote }}
            statusCode: {{ .Values.global.gateway.redirect.statusCode }}
      matches:
        - path:
            type: PathPrefix
            value: /
{{- end }}
