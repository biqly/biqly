{{- $it := .Values.global.observability.infraTelemetry -}}
{{- if and $it $it.enabled $it.nats.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: biqly-nats-exporter
  labels:
    {{- include "biqly.labels" . | nindent 4 }}
    app.kubernetes.io/component: nats-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: biqly-nats-exporter
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: biqly-nats-exporter
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: biqly
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        app.kubernetes.io/component: nats-exporter
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nats-exporter
          image: {{ $it.nats.exporterImage | quote }}
          args:
            - -port={{ $it.nats.exporterPort }}
            - -varz
            - -connz
            - -subz
            - -routez
            - -jsz=all
            - {{ $it.nats.monitorURL | quote }}
          ports:
            - name: metrics
              containerPort: {{ $it.nats.exporterPort }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: biqly-nats-exporter
  labels:
    {{- include "biqly.labels" . | nindent 4 }}
    app.kubernetes.io/component: nats-exporter
spec:
  selector:
    app.kubernetes.io/name: biqly-nats-exporter
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: metrics
      port: {{ $it.nats.exporterPort }}
      targetPort: metrics
{{- end }}
