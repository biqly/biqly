{{- /* Rendered collector config. Referenced by the ConfigMap AND hashed into
       the pod annotation so any config change (values OR template) rolls the
       collector — otelcol does not hot-reload its config file. */ -}}
{{- define "biqly.otelInfraCollectorConfig" -}}
{{- $it := .Values.global.observability.infraTelemetry -}}
{{- $tracing := .Values.global.observability.tracing -}}
{{- $endpoint := $it.otlpEndpoint | default $tracing.otlpEndpoint -}}
{{- $gateway := $tracing.useInClusterCollector -}}
{{- $k8s := and $it.k8sAttributes $it.k8sAttributes.enabled -}}
{{- $env := $it.deploymentEnvironment | default "production" -}}
{{- $recv := list -}}
{{- if $it.postgresql.enabled }}{{- $recv = append $recv "postgresql" -}}{{- end }}
{{- if or $it.dragonfly.enabled $it.nats.enabled }}{{- $recv = append $recv "prometheus" -}}{{- end }}
{{- if $gateway }}{{- $recv = append $recv "otlp" -}}{{- end }}
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  # Token is extracted (Authorization=Bearer <t> -> <t>) by the init
  # container from the shared app OTLP secret; the extension re-adds Bearer.
  bearertokenauth:
    scheme: Bearer
    filename: /etc/otel/auth/token
receivers:
  {{- if $gateway }}
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  {{- end }}
  {{- if $it.postgresql.enabled }}
  postgresql:
    endpoint: {{ printf "%s:%v" $it.postgresql.service $it.postgresql.port | quote }}
    username: {{ $it.postgresql.username | quote }}
    password: ${env:POSTGRES_PASSWORD}
    collection_interval: {{ $it.collectionInterval }}
    tls:
      insecure: true
  {{- end }}
  {{- if or $it.dragonfly.enabled $it.nats.enabled }}
  prometheus:
    config:
      scrape_configs:
        {{- if $it.dragonfly.enabled }}
        - job_name: biqly-dragonfly
          scrape_interval: {{ $it.collectionInterval }}
          static_configs:
            - targets: [{{ $it.dragonfly.target | quote }}]
        {{- end }}
        {{- if $it.nats.enabled }}
        - job_name: biqly-nats
          scrape_interval: {{ $it.collectionInterval }}
          static_configs:
            - targets: [{{ printf "biqly-nats-exporter:%v" $it.nats.exporterPort | quote }}]
        {{- end }}
  {{- end }}
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
  # App traces keep OTEL_SERVICE_NAME (biqly); infra scrapes get biqly-infra.
  resource/namespace:
    attributes:
      - key: service.namespace
        value: biqly
        action: upsert
      - key: deployment.environment
        value: {{ $env | quote }}
        action: upsert
  {{- if $k8s }}
  # Enrich app traces/logs with Kubernetes metadata (namespace/pod/deployment/
  # node) so they are filterable in the backend. The source is the OTLP
  # connection's pod IP; requires the ClusterRole below (pods/replicasets read).
  k8sattributes:
    auth_type: serviceAccount
    passthrough: false
    extract:
      metadata:
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.pod.uid
        - k8s.deployment.name
        - k8s.node.name
    pod_association:
      - sources:
          - from: connection
  # SigNoz's "Host Name" fast filter keys on host.name; k8sattributes only sets
  # k8s.node.name, so copy it across. error_mode: ignore keeps records flowing
  # if the attribute is absent (e.g. mapping missed).
  transform/hostname:
    error_mode: ignore
    trace_statements:
      - context: resource
        statements:
          - set(attributes["host.name"], attributes["k8s.node.name"]) where attributes["k8s.node.name"] != nil
    log_statements:
      - context: resource
        statements:
          - set(attributes["host.name"], attributes["k8s.node.name"]) where attributes["k8s.node.name"] != nil
  {{- end }}
  resource/infra:
    attributes:
      - key: service.namespace
        value: biqly
        action: upsert
      - key: service.name
        value: biqly-infra
        action: upsert
  batch: {}
exporters:
  otlphttp:
    endpoint: {{ $endpoint | quote }}
    auth:
      authenticator: bearertokenauth
    # The queue + retry absorb remote (Cloudflare) slowness here, in a
    # separate pod, so the app exporters never block on the internet link.
    sending_queue:
      enabled: true
      queue_size: 10000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
service:
  extensions: [health_check, bearertokenauth]
  pipelines:
    {{- if $gateway }}
    traces:
      receivers: [otlp]
      processors: [memory_limiter, {{ if $k8s }}k8sattributes, transform/hostname, {{ end }}resource/namespace, batch]
      exporters: [otlphttp]
    # App slog records arrive over the same OTLP hop (SetupLogExport) and
    # follow the traces path to the remote backend (SigNoz).
    logs:
      receivers: [otlp]
      processors: [memory_limiter, {{ if $k8s }}k8sattributes, transform/hostname, {{ end }}resource/namespace, batch]
      exporters: [otlphttp]
    {{- end }}
    metrics:
      receivers: [{{ join ", " $recv }}]
      processors: [memory_limiter, resource/infra, batch]
      exporters: [otlphttp]
{{- end -}}
{{- $it := .Values.global.observability.infraTelemetry -}}
{{- if and $it $it.enabled -}}
{{- $tracing := .Values.global.observability.tracing -}}
{{- $endpoint := $it.otlpEndpoint | default $tracing.otlpEndpoint -}}
{{- $secretName := $it.otlpHeadersSecret.name | default $tracing.otlpHeadersSecret.name -}}
{{- $secretKey := $it.otlpHeadersSecret.key | default $tracing.otlpHeadersSecret.key -}}
{{- /* Gateway role: receive OTLP from the apps and forward to the remote backend
       so the slow internet round-trip never touches the request path. */ -}}
{{- $gateway := $tracing.useInClusterCollector -}}
{{- $k8s := and $it.k8sAttributes $it.k8sAttributes.enabled -}}
{{- $recv := list -}}
{{- if $it.postgresql.enabled }}{{- $recv = append $recv "postgresql" -}}{{- end }}
{{- if or $it.dragonfly.enabled $it.nats.enabled }}{{- $recv = append $recv "prometheus" -}}{{- end }}
{{- if and (not $recv) (not $gateway) }}{{- fail "global.observability.infraTelemetry.enabled is true but every source is disabled and the gateway is off" }}{{- end }}
{{- if $gateway }}{{- $recv = append $recv "otlp" -}}{{- end }}
{{- if not $endpoint }}{{- fail "infraTelemetry needs an OTLP endpoint (set infraTelemetry.otlpEndpoint or observability.tracing.otlpEndpoint)" }}{{- end }}
{{- if not $secretName }}{{- fail "infraTelemetry needs the OTLP headers secret (set infraTelemetry.otlpHeadersSecret or observability.tracing.otlpHeadersSecret)" }}{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: biqly-otel-infra-collector
  labels:
    {{- include "biqly.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-infra-collector
data:
  config.yaml: |
{{ include "biqly.otelInfraCollectorConfig" . | trim | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: biqly-otel-infra-collector
  labels:
    {{- include "biqly.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-infra-collector
spec:
  replicas: 1
  {{- with .Values.global.deploymentStrategy }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .rollingUpdate.maxSurge | default 0 }}
      maxUnavailable: {{ .rollingUpdate.maxUnavailable | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: biqly-otel-infra-collector
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: biqly-otel-infra-collector
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: biqly
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        app.kubernetes.io/component: otel-infra-collector
      annotations:
        checksum/config: {{ include "biqly.otelInfraCollectorConfig" . | sha256sum }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $k8s }}
      serviceAccountName: biqly-otel-infra-collector
      automountServiceAccountToken: true
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: extract-token
          image: busybox:1.37
          command: ["sh", "-c"]
          args:
            - |
              v=$(cat "/etc/otel/secret/{{ $secretKey }}")
              v=${v#Authorization=}
              v=${v#Bearer }
              printf '%s' "$v" | tr -d '\r\n' > /etc/otel/auth/token
          volumeMounts:
            - name: otel-secret
              mountPath: /etc/otel/secret
              readOnly: true
            - name: auth
              mountPath: /etc/otel/auth
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: otel-collector
          image: {{ $it.image | quote }}
          args:
            - --config=/conf/config.yaml
          {{- if $it.postgresql.enabled }}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $it.postgresql.passwordSecret.name | quote }}
                  key: {{ $it.postgresql.passwordSecret.key | quote }}
          {{- end }}
          ports:
            - name: health
              containerPort: 13133
            {{- if $gateway }}
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            {{- if $gateway }}
            tcpSocket:
              port: otlp-http
            initialDelaySeconds: 2
            periodSeconds: 5
            {{- else }}
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /conf
              readOnly: true
            - name: auth
              mountPath: /etc/otel/auth
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            {{- toYaml $it.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: biqly-otel-infra-collector
        - name: otel-secret
          secret:
            secretName: {{ $secretName | quote }}
        - name: auth
          emptyDir: {}
{{- if $gateway }}
---
apiVersion: v1
kind: Service
metadata:
  name: biqly-otel-infra-collector
  labels:
    {{- include "biqly.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-infra-collector
spec:
  selector:
    app.kubernetes.io/name: biqly-otel-infra-collector
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
{{- end }}
{{- if $k8s }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: biqly-otel-infra-collector
  labels:
    {{- include "biqly.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-infra-collector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-otel-infra-collector-k8sattributes
  labels:
    {{- include "biqly.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-infra-collector
rules:
  # Read-only, cluster-wide access the k8sattributes processor needs to map a
  # source pod IP to its namespace/pod/deployment/node metadata.
  - apiGroups: [""]
    resources: [pods, namespaces, nodes]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-otel-infra-collector-k8sattributes
  labels:
    {{- include "biqly.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-infra-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-otel-infra-collector-k8sattributes
subjects:
  - kind: ServiceAccount
    name: biqly-otel-infra-collector
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
