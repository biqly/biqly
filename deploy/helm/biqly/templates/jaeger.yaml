{{- if .Values.global.observability.tracing.jaeger.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: biqly-jaeger
  labels:
    {{- include "biqly.labels" . | nindent 4 }}
    app.kubernetes.io/component: tracing
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: biqly-jaeger
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: biqly-jaeger
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: tracing
        app.kubernetes.io/part-of: biqly
    spec:
      automountServiceAccountToken: false
      containers:
        - name: jaeger
          image: {{ .Values.global.observability.tracing.jaeger.image | quote }}
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: query
              containerPort: 16686
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: biqly-jaeger
  labels:
    {{- include "biqly.labels" . | nindent 4 }}
    app.kubernetes.io/component: tracing
spec:
  selector:
    app.kubernetes.io/name: biqly-jaeger
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: query
      port: 16686
      targetPort: query
{{- end }}
