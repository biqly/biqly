{{- if .Values.global.networkPolicy.enabled }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: biqly-agent-ingress
  labels:
    {{- include "biqly.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: agent
      app.kubernetes.io/part-of: biqly
  ingress:
    # Health/readiness/metrics: host-network Prometheus and Cilium's own
    # health probes (same mechanism as the worker/ai/query/catalog metrics
    # ports in cnp-gateway.yaml).
    - fromEntities:
        - host
        - remote-node
        - health
      toPorts:
        - ports:
            - port: {{ .Values.agent.service.port | quote }}
              protocol: TCP
    # In-cluster callers (e.g. a future admin diagnostics proxy in the API
    # service) reaching the internal-token-gated runs/cancel endpoints. No
    # public route selects agent — there is no HTTPRoute for it at all (see
    # deploy/helm/biqly/charts/agent).
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/part-of: biqly
      toPorts:
        - ports:
            - port: {{ .Values.agent.service.port | quote }}
              protocol: TCP
  # Agent's egress (DNS, NATS, catalog/query/ai, metadata Postgres, OTel) is
  # granted by extending the existing shared policies rather than duplicating
  # them here — see cnp-dns.yaml, cnp-gateway.yaml, cnp-metadata.yaml, and
  # global.networkPolicy.sharedPostgresql.components. Deliberately NOT
  # granted: redis/dragonfly and the auth service — nothing in
  # internal/app/agent_dependencies.go or cmd/agent/main.go calls either.
  # Also deliberately NOT granted: world HTTPS / FQDN egress (cnp-ai-external.yaml)
  # — agent only calls the in-cluster ai/catalog/query services over HTTP; it
  # never talks to an LLM provider or any external host directly.
{{- end }}
