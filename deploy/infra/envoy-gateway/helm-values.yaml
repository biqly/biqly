# Helm values for the Envoy Gateway controller (release: eg).
# Install:
#   helm upgrade --install eg oci://docker.io/envoyproxy/gateway-helm \
#     --namespace envoy-gateway-system --create-namespace \
#     --version v1.8.1 -f deploy/infra/envoy-gateway/helm-values.yaml
#
# GatewayClass + Gateway are applied from this directory (kubectl or ArgoCD).
# TLS secret wildcard-il1-nl-tls must exist in envoy-gateway-system
# (copy or reflect from the gateway namespace).
