---
# GitOps CD for Headlamp (Kubernetes web UI) on the prag cluster.
#
# Unlike biqly/zlitter (charts sourced from git), Headlamp is pulled from the
# upstream kubernetes-sigs Helm repo via a HelmRepository source. Flux
# reconciles the pinned chart version below; bump `version` to upgrade.
#
# Access is private/internal only: an HTTPRoute on the shared eg-gw Gateway
# (like biqly-frontend), with headlamp.il1.nl resolved to the gateway VIP
# (192.168.0.160) by the AdGuard rewrites on zima + prag. It is intentionally
# NOT published through the cloudflared tunnel (cf. hubble, which is blocked
# from the public tunnel), since Headlamp is a broad cluster dashboard.
#
# Auth: unsafeUseServiceAccountToken stays false (chart default), so the UI
# presents a token login screen — users authenticate with their own kubeconfig
# bearer token. The chart still creates a cluster-admin-bound ServiceAccount for
# Headlamp's own in-cluster operations.
#
# The Flux UI plugin (headlamp_flux) is installed in-cluster by the chart's
# plugin manager sidecar, which downloads it from ArtifactHub into the shared
# (emptyDir) pluginsDir. config.watchPlugins makes the server pick it up after
# the sidecar finishes writing (it writes after the server's startup scan).
apiVersion: v1
kind: Namespace
metadata:
  name: headlamp
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: headlamp
  namespace: flux-system
spec:
  interval: 1h
  url: https://kubernetes-sigs.github.io/headlamp/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: flux-system
spec:
  interval: 10m
  releaseName: headlamp
  targetNamespace: headlamp
  storageNamespace: headlamp
  chart:
    spec:
      chart: headlamp
      version: "0.43.0"
      sourceRef:
        kind: HelmRepository
        name: headlamp
        namespace: flux-system
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Served at the root of its own hostname, so no baseURL prefix.
    config:
      inCluster: true
      # The plugin manager sidecar writes plugins into the shared (emptyDir)
      # pluginsDir after the main server has already enumerated it, so the
      # server must watch the dir to pick them up.
      watchPlugins: true
    # Flux UI plugin, installed at startup by the built-in plugin manager
    # (sidecar). Needs cluster egress to artifacthub.io / npm.
    pluginsManager:
      enabled: true
      baseImage: node:lts-alpine
      version: latest
      configContent: |
        plugins:
        - name: headlamp_flux
          source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_flux
          version: 0.6.0
        installOptions:
          parallel: true
          maxConcurrent: 2
---
# Exposes Headlamp on the shared Envoy Gateway (eg-gw), mirroring biqly-frontend.
# headlamp.il1.nl resolves (via AdGuard) to the gateway VIP, which routes to this
# HTTPRoute by hostname. Internal HTTP only; no public tunnel entry.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp
  namespace: headlamp
spec:
  hostnames:
    - headlamp.il1.nl
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: eg-gw
      namespace: envoy-gateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: headlamp
          port: 80
          weight: 1
