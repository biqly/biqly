---
# GitOps CD for the biqly application on the prag cluster.
#
# Flux reconciles this HelmRelease from the flux-system GitRepository (this
# repo, main branch). The chart lives at deploy/helm/biqly and is rendered with
# the base values plus the production overrides. Because image tags are pinned
# in values-prod.yaml (bumped per release by scripts/helm-bump-tags.sh), a push
# to main that changes those tags — or any chart change — is picked up
# automatically and rolled out, replacing the former manual `helm upgrade`.
#
# reconcileStrategy: Revision makes source-controller rebuild the chart on every
# new git revision even when Chart.yaml's version is unchanged, which is exactly
# our case (only values-prod.yaml image tags move between releases).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: biqly
  namespace: flux-system
spec:
  interval: 10m
  releaseName: biqly
  targetNamespace: biqly
  storageNamespace: biqly
  chart:
    spec:
      chart: deploy/helm/biqly
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      valuesFiles:
        - values.yaml
        - values-prod.yaml
  install:
    createNamespace: false
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
    # Take over field ownership from stale managers (an old argocd-controller
    # owns .spec.rules on the biqly-ai HTTPRoute) instead of failing on
    # server-side-apply conflicts — the equivalent of `helm upgrade
    # --force-conflicts` the manual flow used.
    force: true
