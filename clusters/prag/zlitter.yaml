---
# GitOps CD for zlitter on the prag cluster.
#
# Chart and values live in the private zlitter/helm repo. Image tags are
# promoted by promote-images CI into zlitter/values-images.yaml; Flux picks
# up each commit automatically (reconcileStrategy: Revision).
#
# Prod overrides (VIPs, rollouts, network policy) stay in values-rollouts.yaml
# and are human-owned — same split as before with Argo CD.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zlitter
  namespace: flux-system
spec:
  interval: 10m
  releaseName: zlitter
  targetNamespace: zlitter
  storageNamespace: zlitter
  chart:
    spec:
      chart: zlitter
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: zlitter-helm
        namespace: flux-system
      valuesFiles:
        - zlitter/values.yaml
        - zlitter/values-rollouts.yaml
        - zlitter/values-images.yaml
  install:
    createNamespace: false
    remediation:
      retries: 3
    # Flux cannot wait on Rollout readiness (observedGeneration type mismatch
    # in argo-rollouts status); pods are healthy — reconcile without helm --wait.
    disableWait: true
  upgrade:
    remediation:
      retries: 3
    disableWait: true
    # Adopt the existing manual Helm release (rev 26+) and win SSA conflicts
    # on HTTPRoutes / Cilium policies — same pattern as biqly.
    force: true
  driftDetection:
    mode: enabled
    ignore:
      # HPA scales Rollout replicas; do not revert to chart defaults.
      - paths:
          - /spec/replicas
        target:
          kind: Rollout
          group: argoproj.io
