---
# GitOps CD for zlitter on the prag cluster.
#
# Chart and values live in the private zlitter/helm repo. Image tags are
# promoted by promote-images CI into zlitter/values-images.yaml; Flux picks
# up each commit automatically (reconcileStrategy: Revision).
#
# Prod overrides (VIPs, deployment strategy, network policy) stay in
# values-rollouts.yaml and are human-owned.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zlitter
  namespace: flux-system
spec:
  interval: 10m
  releaseName: zlitter
  targetNamespace: zlitter
  storageNamespace: zlitter
  chart:
    spec:
      chart: zlitter
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: zlitter-helm
        namespace: flux-system
      valuesFiles:
        - zlitter/values.yaml
        - zlitter/values-rollouts.yaml
        - zlitter/values-images.yaml
  install:
    createNamespace: false
    remediation:
      retries: 3
    disableWait: true
  upgrade:
    remediation:
      retries: 3
    disableWait: true
    force: true
