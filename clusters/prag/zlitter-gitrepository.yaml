---
# Private Helm chart source for zlitter (github.com/zlitter/helm).
# Deploy key: flux-prag (read-only), secret zlitter-helm in flux-system.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: zlitter-helm
  namespace: flux-system
spec:
  interval: 1m
  url: ssh://git@github.com/zlitter/helm
  ref:
    branch: main
  secretRef:
    name: zlitter-helm
