# yaml-language-server: $schema=https://golangci-lint.run/jsonschema/golangci.next.jsonschema.json
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - revive
    - govet
    - staticcheck
    - gosec
    - ineffassign
    - misspell
    - gocyclo
    - bodyclose
    - unused
    - unparam
    - prealloc
    - copyloopvar
    - nolintlint
    - errorlint
    - nilerr
    - noctx
    - whitespace
    - exhaustive
    - contextcheck
    - wastedassign
    - forbidigo
    - usestdlibvars
  settings:
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: exported
        - name: var-naming
        - name: package-comments
    gocyclo:
      min-complexity: 15
    govet:
      enable:
        - shadow
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: use structured logger instead of fmt.Print*
        - pattern: ^panic$
          msg: avoid panic in application code
