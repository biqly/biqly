server {
    listen 3333;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /env-config.js {
        add_header Cache-Control "no-store" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header X-Content-Type-Options "nosniff" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header X-Frame-Options "DENY" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Referrer-Policy "strict-origin-when-cross-origin" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        try_files $uri =404;
    }

    # AI endpoints can run long (LLM calls); allow extended read/send timeouts.
    # Longest-prefix match means /api/ai/* lands here before the generic /api/.
    location /api/ai/ {
        proxy_pass http://api:8888;
        # $host forwards the real client Host so the backend sees the request
        # domain. This proxy is dev/compose-only (prod routes /api/* via
        # cloudflared and never loads this file) and the upstream is a trusted
        # internal service, so the host-injection rule is intentionally suppressed.
        proxy_set_header Host $host; # nosemgrep: generic.nginx.security.request-host-used.request-host-used
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host; # nosemgrep: generic.nginx.security.request-host-used.request-host-used
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 10s;
        proxy_send_timeout 650s;
        proxy_read_timeout 650s;
        add_header X-Content-Type-Options "nosniff" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header X-Frame-Options "DENY" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Referrer-Policy "strict-origin-when-cross-origin" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
    }

    # All other API calls use a conservative timeout so connections are not held
    # open longer than a normal request needs.
    location /api/ {
        proxy_pass http://api:8888;
        # See the /api/ai/ block above for why $host is forwarded and the
        # host-injection rule is suppressed (dev/compose-only, trusted upstream).
        proxy_set_header Host $host; # nosemgrep: generic.nginx.security.request-host-used.request-host-used
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host; # nosemgrep: generic.nginx.security.request-host-used.request-host-used
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        add_header X-Content-Type-Options "nosniff" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header X-Frame-Options "DENY" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Referrer-Policy "strict-origin-when-cross-origin" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
    }

    # SPA: any unmatched path falls back to index.html so the React router
    # can handle it client-side.
    location / {
        add_header X-Content-Type-Options "nosniff" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header X-Frame-Options "DENY" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Referrer-Policy "strict-origin-when-cross-origin" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        try_files $uri $uri/ /index.html;
    }

    # Static assets: long cache, immutable.
    location ~* \.(js|css|svg|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header X-Content-Type-Options "nosniff" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header X-Frame-Options "DENY" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Referrer-Policy "strict-origin-when-cross-origin" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        try_files $uri =404;
    }
}
