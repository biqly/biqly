server {
    listen 3333;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to the backend service.
    location /api/ {
        proxy_pass http://api:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 650s;
        proxy_send_timeout 650s;
        proxy_read_timeout 650s;
    }

    # SPA: any unmatched path falls back to index.html so the React router
    # can handle it client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets: long cache, immutable.
    location ~* \.(js|css|svg|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Light security headers; tune CSP for your deployment as needed.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
