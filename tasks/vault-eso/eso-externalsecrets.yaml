apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: biqly-db
  namespace: biqly
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: vault-biqly }
  target:
    name: biqly-db
    creationPolicy: Owner
  dataFrom:
    - extract: { key: db }
---
