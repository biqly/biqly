services:
  metadata-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: bi_metadata
      POSTGRES_USER: bi_user
      POSTGRES_PASSWORD: bi_password
    ports:
      - "5432:5432"
    volumes:
      - metadata_data:/var/lib/postgresql
      - ./migrations:/migrations:ro
      - ./scripts/init-metadata-db.sh:/docker-entrypoint-initdb.d/001-init-metadata-db.sh:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U bi_user -d bi_metadata" ]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.34.1
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2.10-alpine
    command: [ "-js", "-m", "8222" ]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # Test PostgreSQL datasource for introspection testing.
  # Seeds AdventureWorks on first init if testdata/adventureworks/ exists
  # (run scripts/fetch-adventureworks.sh once to populate it).
  test-datasource:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: test_data
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    ports:
      - "5433:5432"
    volumes:
      - test_data:/var/lib/postgresql
      - ./testdata/adventureworks:/adventureworks
      - ./scripts/init-adventureworks.sh:/docker-entrypoint-initdb.d/10-adventureworks.sh:ro

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    environment:
      BI_METADATA_DB_DSN: postgres://bi_user:bi_password@metadata-db:5432/bi_metadata?sslmode=disable
    depends_on:
      metadata-db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    # AI providers/models are configured at runtime in the database (admin UI,
    # Administration → AI Providers), not via environment variables. Project
    # `.env` only carries operational AI knobs (timeouts, rate limit, etc.).
    env_file:
      - path: .env
        required: false
    ports:
      - "8888:8888"
    depends_on:
      metadata-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      auth:
        condition: service_healthy

  auth-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: bi_auth
      POSTGRES_USER: bi_auth_user
      POSTGRES_PASSWORD: bi_auth_password
    ports:
      - "5434:5432"
    volumes:
      - auth_data:/var/lib/postgresql
      - ./migrations/auth:/migrations:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U bi_auth_user -d bi_auth" ]
      interval: 5s
      timeout: 3s
      retries: 5

  auth-migrate:
    build:
      context: .
      dockerfile: Dockerfile.auth
    entrypoint: [ "/auth-migrate" ]
    command: [ "-dir", "/migrations/auth", "up" ]
    environment:
      BI_AUTH_DB_DSN: postgres://bi_auth_user:bi_auth_password@auth-db:5432/bi_auth?sslmode=disable
    depends_on:
      auth-db:
        condition: service_healthy
    restart: "no"

  auth:
    build:
      context: .
      dockerfile: Dockerfile.auth
    env_file:
      - path: .env
        required: false
    ports:
      - "8889:8889"
    depends_on:
      auth-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully
      mail:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:8889/health" ]
      interval: 5s
      timeout: 3s
      retries: 5

  mail-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: bi_mail
      POSTGRES_USER: bi_mail_user
      POSTGRES_PASSWORD: bi_mail_password
    ports:
      - "5435:5432"
    volumes:
      - mail_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U bi_mail_user -d bi_mail" ]
      interval: 5s
      timeout: 3s
      retries: 5

  mail-migrate:
    build:
      context: .
      dockerfile: Dockerfile.mail
    entrypoint: [ "/mail-migrate" ]
    command: [ "-dir", "/migrations/mail", "up" ]
    environment:
      BI_MAIL_DB_DSN: postgres://bi_mail_user:bi_mail_password@mail-db:5432/bi_mail?sslmode=disable
    depends_on:
      mail-db:
        condition: service_healthy
    restart: "no"

  mail:
    build:
      context: .
      dockerfile: Dockerfile.mail
    env_file:
      - path: .env
        required: false
    ports:
      - "8890:8890"
    depends_on:
      mail-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mail-migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Loaded from project .env for variable substitution (must match BI_ADMIN_API_KEY).
        VITE_BI_ADMIN_API_KEY: ${VITE_BI_ADMIN_API_KEY}
    ports:
      - "3333:3333"
    depends_on:
      - api

volumes:
  metadata_data:
  test_data:
  auth_data:
  mail_data:
