services:
  metadata-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: bi_metadata
      POSTGRES_USER: bi_user
      POSTGRES_PASSWORD: bi_password
    ports:
      - "5432:5432"
    volumes:
      - metadata_data:/var/lib/postgresql
      - ./migrations:/migrations:ro
      - ./scripts/init-metadata-db.sh:/docker-entrypoint-initdb.d/001-init-metadata-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bi_user -d bi_metadata"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Test PostgreSQL datasource for introspection testing.
  # Seeds AdventureWorks on first init if testdata/adventureworks/ exists
  # (run scripts/fetch-adventureworks.sh once to populate it).
  test-datasource:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: test_data
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    ports:
      - "5433:5432"
    volumes:
      - test_data:/var/lib/postgresql
      - ./testdata/adventureworks:/adventureworks
      - ./scripts/init-adventureworks.sh:/docker-entrypoint-initdb.d/10-adventureworks.sh:ro

  # SQL Server on Linux for local Biqly testing (port 1433).
  # Default image: Azure SQL Edge — SQL Server engine, native on linux/arm64 and linux/amd64 (incl. Apple Silicon).
  # Full SQL Server 2022 on x86_64 Linux only: docker compose --profile sqlserver-2022 up -d test-sqlserver-2022 sqlserver-init-2022
  # Biqly DSN (empty DB): sqlserver://test_user:Test_password123!@localhost:1433?database=test_data&encrypt=disable
  # BikeStores sample: sqlserver://test_user:Test_password123!@localhost:1433?database=BikeStores&encrypt=disable
  test-sqlserver:
    image: mcr.microsoft.com/azure-sql-edge:latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Test_password123!}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pidof sqlservr > /dev/null && bash -c 'echo > /dev/tcp/127.0.0.1/1433'",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  sqlserver-init:
    image: mcr.microsoft.com/mssql-tools:latest
    platform: linux/amd64
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Test_password123!}
      SQL_HOST: test-sqlserver
    depends_on:
      test-sqlserver:
        condition: service_healthy
    volumes:
      - ./scripts/init-sqlserver-db.sql:/init.sql:ro
      - ./scripts/load-sqlserver-sample.sh:/load-sample.sh:ro
      - ./scripts/sql-server-sample-database:/sample:ro
    entrypoint: ["/bin/bash", "/load-sample.sh"]
    restart: "no"

  # Optional: Microsoft SQL Server 2022 (linux/amd64 only — Linux CI/VMs, not Apple Silicon).
  test-sqlserver-2022:
    profiles: [sqlserver-2022]
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Test_password123!}
      MSSQL_PID: Developer
    ports:
      - "1434:1433"
    volumes:
      - sqlserver_2022_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  sqlserver-init-2022:
    profiles: [sqlserver-2022]
    image: mcr.microsoft.com/mssql-tools:latest
    platform: linux/amd64
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Test_password123!}
      SQL_HOST: test-sqlserver-2022
    depends_on:
      test-sqlserver-2022:
        condition: service_healthy
    volumes:
      - ./scripts/init-sqlserver-db.sql:/init.sql:ro
      - ./scripts/load-sqlserver-sample.sh:/load-sample.sh:ro
      - ./scripts/sql-server-sample-database:/sample:ro
    entrypoint: ["/bin/bash", "/load-sample.sh"]
    restart: "no"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    environment:
      BI_METADATA_DB_DSN: postgres://bi_user:bi_password@metadata-db:5432/bi_metadata?sslmode=disable
    depends_on:
      metadata-db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    # Secrets / AI: project `.env` (BI_AI_API_KEY, BI_AI_MODEL, BI_AI_BASE_URL,
    # optional BI_AI_EMBEDDING_MODEL, BI_AI_EMBEDDING_BASE_URL, BI_AI_EMBEDDING_API_KEY).
    env_file:
      - path: .env
        required: false
    environment:
      BI_HTTP_PORT: 8888
      BI_METADATA_DB_DSN: postgres://bi_user:bi_password@metadata-db:5432/bi_metadata?sslmode=disable
      BI_REDIS_DSN: redis://redis:6379
      BI_QUERY_TIMEOUT_SECONDS: 30
      BI_QUERY_MAX_ROWS: 10000
      BI_QUERY_MAX_RUNTIME_SECONDS: 60
      BI_AUTH_ENABLED: "true"
      BI_AUTH_SERVICE_URL: http://auth:8889
      BI_AUTH_INTERNAL_TOKEN: dev-internal-token
    ports:
      - "8888:8888"
    depends_on:
      metadata-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      auth:
        condition: service_healthy

  auth-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: bi_auth
      POSTGRES_USER: bi_auth_user
      POSTGRES_PASSWORD: bi_auth_password
    ports:
      - "5434:5432"
    volumes:
      - auth_data:/var/lib/postgresql
      - ./migrations/auth:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bi_auth_user -d bi_auth"]
      interval: 5s
      timeout: 3s
      retries: 5

  auth-migrate:
    build:
      context: .
      dockerfile: Dockerfile.auth-migrate
    environment:
      BI_AUTH_DB_DSN: postgres://bi_auth_user:bi_auth_password@auth-db:5432/bi_auth?sslmode=disable
    depends_on:
      auth-db:
        condition: service_healthy
    restart: "no"

  auth:
    build:
      context: .
      dockerfile: Dockerfile.auth
    environment:
      BI_AUTH_PORT: 8889
      BI_AUTH_DB_DSN: postgres://bi_auth_user:bi_auth_password@auth-db:5432/bi_auth?sslmode=disable
      BI_AUTH_REDIS_DSN: redis://redis:6379
      BI_AUTH_INTERNAL_TOKEN: dev-internal-token
      BI_AUTH_RATE_LIMIT_PER_MINUTE: 60
      BI_AUTH_WEBAUTHN_RP_ID: localhost
      BI_AUTH_WEBAUTHN_RP_NAME: Biqly
      BI_AUTH_WEBAUTHN_RP_ORIGINS: http://localhost:5173,http://localhost:3333
      BI_AUTH_MAIL_SERVICE_URL: http://mail:8890
      BI_AUTH_MAIL_INTERNAL_TOKEN: dev-internal-token
    ports:
      - "8889:8889"
    depends_on:
      auth-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully
      mail:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8889/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  mail-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: bi_mail
      POSTGRES_USER: bi_mail_user
      POSTGRES_PASSWORD: bi_mail_password
    ports:
      - "5435:5432"
    volumes:
      - mail_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bi_mail_user -d bi_mail"]
      interval: 5s
      timeout: 3s
      retries: 5

  mail-migrate:
    build:
      context: .
      dockerfile: Dockerfile.mail
    entrypoint: ["/mail-migrate"]
    command: ["-dir", "/migrations/mail", "up"]
    environment:
      BI_MAIL_DB_DSN: postgres://bi_mail_user:bi_mail_password@mail-db:5432/bi_mail?sslmode=disable
    depends_on:
      mail-db:
        condition: service_healthy
    restart: "no"

  mail:
    build:
      context: .
      dockerfile: Dockerfile.mail
    environment:
      BI_MAIL_PORT: 8890
      BI_MAIL_DB_DSN: postgres://bi_mail_user:bi_mail_password@mail-db:5432/bi_mail?sslmode=disable
      BI_MAIL_REDIS_DSN: redis://redis:6379
      BI_MAIL_INTERNAL_TOKEN: dev-internal-token
      BI_MAIL_FRONTEND_BASE_URL: http://localhost:3333
      BI_MAIL_EMAIL_DEFAULT_LOCALE: en
    ports:
      - "8890:8890"
    depends_on:
      mail-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mail-migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Loaded from project .env for variable substitution (must match BI_ADMIN_API_KEY).
        VITE_BI_ADMIN_API_KEY: ${VITE_BI_ADMIN_API_KEY}
    ports:
      - "3333:3333"
    depends_on:
      - api

volumes:
  metadata_data:
  test_data:
  sqlserver_data:
  sqlserver_2022_data:
  auth_data:
  mail_data:
