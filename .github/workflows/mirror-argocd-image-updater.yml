name: Mirror Argo CD Image Updater

# Upstream lives on quay.io; our cluster cannot reach quay reliably. Mirror to GHCR
# so the argocd-image-updater controller can pull from ghcr.io/biqly/* instead.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main]
    paths:
      - .github/workflows/mirror-argocd-image-updater.yml

permissions:
  contents: read
  packages: write

env:
  UPSTREAM_IMAGE: quay.io/argoprojlabs/argocd-image-updater:v1.2.0
  TARGET_IMAGE: ghcr.io/biqly/argocd-image-updater:v1.2.0

jobs:
  mirror:
    name: Mirror to GHCR
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Copy the full multi-arch manifest (arm64 + amd64). A single-arch docker pull/push
      # on ubuntu-amd64 breaks arm64 clusters with "exec format error".
      - name: Copy multi-arch manifest to GHCR
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "${TARGET_IMAGE}" "${UPSTREAM_IMAGE}"
          docker buildx imagetools inspect "${TARGET_IMAGE}"
          echo "Mirrored ${UPSTREAM_IMAGE} -> ${TARGET_IMAGE}"
