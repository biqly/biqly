name: Auto-bump prod tags

# Closes the CD loop: after the image-building workflows finish on main, this
# checks whether the full image set exists for the current main tip and, if so,
# rewrites the pinned tags in values-prod.yaml and pushes the bump. FluxCD
# (GitRepository interval 1m) then reconciles the change onto the prag cluster.
# No local action and no manual helm upgrade — pushing code to main is the whole
# release action.
#
# It targets main's current HEAD and bumps each service whose image for that
# sha is already published, leaving the rest on their current (valid) tags. As
# later builds finish they re-trigger this and fill in the remaining services,
# so the set converges to the newest sha. This keeps partial changes (e.g. a
# frontend-only commit, where backend images aren't rebuilt) deployable instead
# of stranded — every pinned tag always points at a real, built image.

on:
  workflow_run:
    workflows:
      - CI
      - Build Agent Image
      - Build AI Image
      - Build Auth Image
      - Build Catalog Image
      - Build Mail Image
      - Build MCP Image
      - Build Migrate Image
      - Build Query Image
      - Build Worker Image
    types: [completed]

permissions:
  contents: write
  packages: read

# Serialize so overlapping build completions don't race on the push; the bump
# is idempotent (only commits on a real diff), so queued runs are cheap.
concurrency:
  group: auto-bump-prod
  cancel-in-progress: false

jobs:
  bump:
    name: Bump prod image tags
    # Only for successful builds on main.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          # Full history so the bump can walk back to the newest published
          # image per service (LATEST_PER_SERVICE). Persisted token pushes below.
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_arm64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Log in to GHCR (for image manifest checks)
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Bump tags to the newest published image per service
        id: bump
        env:
          LATEST_PER_SERVICE: "1"
        run: |
          bash scripts/helm-bump-tags.sh
          if git diff --quiet -- deploy/helm/biqly/values-prod.yaml; then
            echo "Tags already current; no bump needed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push the bump
        if: steps.bump.outputs.changed == 'true'
        run: |
          short=$(git rev-parse --short=8 HEAD)
          git config user.name "biqly-ci[bot]"
          git config user.email "biqly-ci[bot]@users.noreply.github.com"
          git add deploy/helm/biqly/values-prod.yaml
          # [skip ci] is belt-and-suspenders; a GITHUB_TOKEN push does not
          # re-trigger workflows and the change only touches deploy/** anyway.
          git commit -m "chore(deploy): auto-bump prod image tags to sha-${short} [skip ci]"
          git push origin main
