name: ZAP Full Scan

# Full DAST scan: ajax-spider + active scanner (simulated attacks).
# Generates OpenAPI from the chi router, imports it into ZAP as seed
# endpoints, then runs the full active scan suite. ~20-40 min per run.
#
# Trigger: manual (workflow_dispatch) only.
# ⚠ Active scanning sends attack payloads — only run against staging/dev
# targets, never against production.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target URL (staging/dev only — NOT production)"
        required: false
        default: "https://abi.il1.nl"

permissions:
  contents: read

jobs:
  zap-full:
    name: ZAP Full (active)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      TARGET: ${{ github.event.inputs.target || 'https://abi.il1.nl' }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ github.token }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Generate OpenAPI spec from router
        run: |
          go run ./cmd/gen-openapi -o openapi.json
          echo "Endpoints discovered:"
          jq '.paths | length' openapi.json

      - name: ZAP Full Scan
        uses: zaproxy/action-api-scan@5158fe4d9d8fcc75ea204db81317cce7f9e5453d # v0.10.0
        with:
          target: /zap/wrk/openapi.json
          format: openapi
          cmd_options: -I -O ${{ env.TARGET }}
          allow_issue_writing: false
          fail_action: false

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-full-report
          path: |
            report_html.html
            report_json.json
            report_md.md
          retention-days: 30
