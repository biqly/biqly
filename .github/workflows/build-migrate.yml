name: Build Migrate Image

on:
  # Build on every non-generated main push: the Helm migrate job runs the
  # migrate image at the same sha-<commit> tag as the catalog image, so a
  # matching migrate image must exist for every commit any service builds at.
  push:
    branches: [main]
    paths-ignore:
      - 'deploy/helm/biqly/.argocd-source-*.yaml'
  pull_request:
    branches: [main]
    paths:
      - cmd/migrate/**
      - internal/**
      - pkg/**
      - migrations/**
      - go.mod
      - go.sum
      - Dockerfile.migrate
      - .github/workflows/build-migrate.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build migrate image
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ github.token }}

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/biqly/migrate
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.migrate
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
