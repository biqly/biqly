name: Test

on:
  push:
    branches: [main]
    paths-ignore:
      - deploy/**
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ github.token }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Download modules
        run: go mod download

      - name: Test
        run: go test ./...

  eval-regression:
    name: Eval regression gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ github.token }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Download modules
        run: go mod download

      - name: Regression gate
        run: make eval-regression

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ github.token }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Download modules
        run: go mod download

      - name: Generate coverage profile
        run: go test -coverprofile=coverage.out ./internal/dialect/... ./internal/datasource/... ./internal/config/... ./internal/dashboard/... ./internal/queue/...

      - name: Coverage gate
        run: go run ./scripts/coveragecheck -profile coverage.out

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ github.token }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-mode: goinstall
          args: --timeout=5m

  helm:
    name: Helm lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ github.token }}

      - uses: azure/setup-helm@v5

      - name: Lint chart
        run: make helm-lint

      - name: Render chart
        run: make helm-template
