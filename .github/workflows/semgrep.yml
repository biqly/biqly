name: Semgrep

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '.github/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '.github/**'
  schedule:
    # Run weekly on Sunday at 00:00 UTC
    - cron: '0 0 * * 0'

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Security Scan
    runs-on: ubuntu-latest
    
    # Skip running on dependabot PRs to save CI time
    if: github.actor != 'dependabot[bot]'

    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep Scan
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/golang \
            --config p/react \
            --config p/typescript \
            --config p/javascript \
            --config p/owasp-top-ten \
            --sarif \
            --output semgrep.sarif

      - name: Fail on active Semgrep findings
        run: |
          node -e 'const fs=require("fs"); const sarif=JSON.parse(fs.readFileSync("semgrep.sarif","utf8")); const results=(sarif.runs||[]).flatMap(r=>r.results||[]); const active=results.filter(r=>!(r.suppressions&&r.suppressions.length)); if (active.length) { for (const r of active) { const loc=r.locations&&r.locations[0]&&r.locations[0].physicalLocation; console.error(`${r.ruleId} ${loc&&loc.artifactLocation&&loc.artifactLocation.uri}:${loc&&loc.region&&loc.region.startLine}`); } process.exit(1); } console.log(`No active Semgrep findings (${results.length} suppressed).`);'

      # Upload results to GitHub Security tab (runs if Semgrep completes, continues on error if GHAS is disabled)
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
        if: always()
        continue-on-error: true
