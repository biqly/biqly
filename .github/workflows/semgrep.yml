name: Semgrep

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '.github/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '.github/**'
  schedule:
    # Run weekly on Sunday at 00:00 UTC
    - cron: '0 0 * * 0'

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Security Scan
    runs-on: ubuntu-latest
    
    # Skip running on dependabot PRs to save CI time
    if: github.actor != 'dependabot[bot]'

    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep Scan
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/golang \
            --config p/react \
            --config p/typescript \
            --config p/javascript \
            --config p/owasp-top-ten \
            --error \
            --sarif \
            --output semgrep.sarif

      # Upload results to GitHub Security tab (runs if Semgrep completes, continues on error if GHAS is disabled)
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
        if: always()
        continue-on-error: true
