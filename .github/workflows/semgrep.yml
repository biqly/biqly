name: Semgrep

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '.github/**'
      - 'deploy/helm/biqly/.argocd-source-*.yaml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '.github/**'
      - 'deploy/helm/biqly/.argocd-source-*.yaml'
  schedule:
    # Weekly SAST: Sunday 00:00 UTC (complements dependabot weekly + CI govulncheck)
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Security Scan
    runs-on: ubuntu-latest
    
    # Skip running on dependabot PRs to save CI time
    if: github.actor != 'dependabot[bot]'

    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Run Semgrep Scan
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/golang \
            --config p/react \
            --config p/typescript \
            --config p/javascript \
            --config p/owasp-top-ten \
            --sarif \
            --output semgrep.sarif

      - name: Fail on active Semgrep findings
        run: python3 scripts/check-semgrep-sarif.py semgrep.sarif

      # Upload results to GitHub Security tab (runs if Semgrep completes, continues on error if GHAS is disabled)
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          sarif_file: semgrep.sarif
        if: always()
        continue-on-error: true
